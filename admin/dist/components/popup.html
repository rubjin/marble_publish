<!-- 
  [D] 모달 팝업 컴포넌트 개발 가이드
  - 팝업 열기: .popupDimmed에 'isOpen' 클래스 추가
  - 팝업 닫기: .popupDimmed에서 'isOpen' 클래스 제거
  - 사이즈: 기본(MD), 'lg'(큰 팝업: .popupWrap.lg)
-->

<!-- 1. 기본 모달 팝업 (Default) -->
<!-- [D] 팝업 노출 시: isOpen 클래스 추가 (예: class="popupDimmed isOpen") -->
<div id="popupBasic" class="popupDimmed">
  <div class="popupWrap">
    <div class="popupHeader">
      <h2 class="popupTitle">팝업 타이틀 (기본)</h2>
      <button type="button" class="btnClose" aria-label="닫기"></button>
    </div>
    <div class="popupBody">
      <p>기본 사이즈 팝업 컨텐츠 영역입니다.</p>
      <p>여기에 텍스트나 폼 요소 등 다양한 내용을 넣을 수 있습니다.</p>
    </div>
    <div class="popupFooter">
      <button type="button" class="btn outline">취소</button>
      <button type="button" class="btn primary">확인</button>
    </div>
  </div>
</div>

<!-- 2. 대형 모달 팝업 (Large) -->
<div id="popupLarge" class="popupDimmed">
  <div class="popupWrap lg">
    <div class="popupHeader">
      <h2 class="popupTitle">팝업 타이틀 (Large)</h2>
      <button type="button" class="btnClose" aria-label="닫기"></button>
    </div>
    <div class="popupBody">
      <p>가로 너비가 넓은(lg) 팝업입니다. 복잡한 표나 폼이 들어갈 때 사용합니다.</p>
    </div>
    <div class="popupFooter">
      <button type="button" class="btn primary">확인</button>
    </div>
  </div>
</div>
