<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404에러 | Admin</title>
  <link rel="stylesheet" href="../../assets/css/globals.css" />
</head>
<body class="errorBody">
  <div class="errorPage">
    <div class="errorContainer">
      <!-- 상태 비주얼 및 코드 -->
      <div class="errorVisual">
        <span class="logoTitle"></span>
      </div>

      <!-- 에러 안내 문구 -->
      <h1 class="errorTitle">페이지를 찾을 수 없습니다.</h1>
      <p class="errorDesc">
        접속한 페이지의 주소(URL)가 잘못 입력되었거나<br />
        페이지의 주소가 변경 또는 삭제되어 해당 페이지에 접속할 수 없습니다.<br />
        입력하신 주소(URL)를 다시 한번 확인해 주세요.
      </p>

      <!-- 버튼 액션 -->
      <div class="errorActions">
        <button type="button" class="btn outline lg" onclick="history.back();">이전 페이지</button>
        <a href="../../layout/layout.html" class="btn primary lg">홈으로 이동</a>
      </div>

    </div>
  </div>
  <script src="../../assets/js/ui.js"></script>
</body>
</html>
