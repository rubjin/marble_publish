      <li class="isOpen">
        <a href="#" class="isActive">
          <span class="text">미션관리</span>
          <span class="arrow"></span>
        </a>
        <ul class="boSubMenu">
          <li>

          <span class="arrow"></span>
        </a>
      </li>

        </a>
      </li>
      <li>

          <span class="arrow"></span>
        </a>
      </li>
      <li>
        <a href="#">
          <span class="text">관리자 관리</span>
          <span class="arrow"></span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- 하단 영역 (세션연장/로그아웃 버튼 및 접기 버튼) -->
  <div class="sideBottom">
    <div class="sideBtns">
      <button type="button" class="btnSide">세션연장</button>
      <button type="button" class="btnSide">로그아웃</button>
    </div>
    <button type="button" class="btnFold" aria-label="사이드바 축소/확대">
