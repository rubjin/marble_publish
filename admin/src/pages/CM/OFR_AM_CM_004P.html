<include src="../../layout/layoutDefault.html" title="개인정보조회사유">

  <!-- 페이지 상단 헤더 (좌측: 타이틀 / 우측: 브래드크럼) -->
  <include src="../../partials/pageHeader.html" title="개인정보조회사유" breadcrumb=""></include>


  <!-- [팝업] -->
  <!-- [D] 퍼블 확인용 .isOpen 상태로 노출 -->
  <div id="" class="popupDimmed isOpen">
    <div class="popupWrap lg">
      <div class="popupHeader">
        <h2 class="popupTitle">개인정보조회사유</h2>
        <button type="button" class="btnClose" aria-label="닫기"></button>
      </div>
      <div class="popupBody">
        <div class="tblSection">
          <include src="../../partials/viewSection.html" title="">
            <tr>
              <th><label class="formLabel">구분 <span class="required">*</span></label></th>
              <td>
                <include src="../../partials/checkGroup.html" name="noticeUse" options="분석업무,고객제공,대외기관 요청/제공,업무마감,기타" legend="사용여부 선택"></include>
              </td>
            </tr>
            <tr>
              <th><label class="formLabel" for="noticeContent">사유 <span class="required">*</span></label></th>
              <td>
                <div class="formControlWrap full">
                  <textarea id="noticeContent" class="formControl full" rows="4" maxlength="1000" placeholder="다운로드 사유 입력"></textarea>
                </div>
              </td>
            </tr>
          </include>
        </div>
      </div>
      <div class="popupFooter">
        <button type="button" class="btn outline">취소</button>
        <button type="button" class="btn primary btnClose">저장</button>
      </div>
    </div>
  </div>

</include>
