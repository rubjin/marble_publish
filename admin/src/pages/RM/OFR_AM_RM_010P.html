<include src="../../layout/layoutDefault.html" title="자산성장 트레킹 고객 참여 내역">

  <!-- 페이지 상단 헤더 (좌측: 타이틀 / 우측: 브래드크럼) -->
  <include src="../../partials/pageHeader.html" title="자산성장 트레킹 고객 참여 내역" breadcrumb="홈,미션관리,미션참여내역"></include>


  <!-- [팝업] -->
  <!-- [D] 퍼블 확인용 .isOpen 상태로 노출 -->
  <div id="popupStockView" class="popupDimmed isOpen">
    <div class="popupWrap lg">
      <div class="popupHeader">
        <h2 class="popupTitle">지급검토 설정</h2>
        <button type="button" class="btnClose" aria-label="닫기"></button>
      </div>
      <div class="popupBody">

        <div class="tblSection">
          <!-- 테이블 상단 건수 : 건수가 있을때 .point 추가 -->
          <include src="../../partials/tblTop.html" count="20">
          <div class="btnGroup">
            <button type="button" class="btn danger">삭제</button>
            <button type="button" class="btn dark">추가</button>
          </div>

          </include>

          <!-- 종목조회 내역 테이블 -->
          <div class="tblWrap">
            <table class="tbl tblBordered">
              <colgroup>
                <col style="width: 50px;">
                <col style="width: 120px;">
                <col style="width: 200px;">
                <col style="width: 100px;">
                <col style="width: 140px;">
                <col style="width: 140px;">
                <col style="width: 140px;">
              </colgroup>
              <thead>
                <tr>
                  <th>
                    <label class="formCheck">
                      <input type="checkbox" aria-label="전체 선택" />
                      <span class="checkIcon"></span>
                    </label>
                  </th>
                  <th>검토구분</th>
                  <th>상세</th>
                  <th>사용여부<span class="required">*</span></th>
                  <th>승인설정<span class="required">*</span></th>
                  <th>설정1</th>
                  <th>설정2</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <label class="formCheck">
                      <input type="checkbox" aria-label="행 선택" />
                      <span class="checkIcon"></span>
                    </label>
                  </td>
                  <td>
                    <input type="text" class="formControl full" value="월평균고액" placeholder="검토구분 입력" />
                  </td>
                  <td>
                    <input type="text" class="formControl full" value="월평균고액" placeholder="검토구분 입력" />
                    <!-- <textarea class="formControl full" rows="2" placeholder="상세 내용 입력">월 평균치 200% 이상(평균 대비 고액)</textarea> -->
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="Y">사용</option>
                      <option value="N">사용안함</option>
                    </select>
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="">선택</option>
                    </select>
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="">선택</option>
                    </select>
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="">선택</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td>
                    <label class="formCheck">
                      <input type="checkbox" aria-label="행 선택" />
                      <span class="checkIcon"></span>
                    </label>
                  </td>
                  <td>
                    <input type="text" class="formControl full" value="월평균고액" placeholder="검토구분 입력" />
                  </td>
                  <td>
                    <input type="text" class="formControl full" value="월평균고액" placeholder="검토구분 입력" />
                    <!-- <textarea class="formControl full" rows="2" placeholder="상세 내용 입력">월 평균치 200% 이상(평균 대비 고액)</textarea> -->
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="Y">사용</option>
                      <option value="N">사용안함</option>
                    </select>
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="">담당자승인</option>
                    </select>
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="">선택</option>
                    </select>
                  </td>
                  <td>
                    <select class="formControl full">
                      <option value="">선택</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="popupFooter">
        <button type="button" class="btn outline">취소</button>
        <button type="button" class="btn primary btnClose">저장</button>
      </div>
    </div>
  </div>

</include>
