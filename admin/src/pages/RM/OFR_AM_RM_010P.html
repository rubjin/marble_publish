<include src="../../layout/layoutDefault.html" title="자산성장 트레킹 고객 참여 내역">

          <div class="tblWrap">
            <table class="tbl tblBordered">

                <col style="width: 100px;">
                <col style="width: 100px;">
                <col style="width: 100px;">
                <col style="width: 100px;">

                  <td>사용</td>
                  <td>선택</td>
                  <td>선택</td>
                  <td>선택</td>
                </tr>
                <tr>

                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="popupFooter">
        <button type="button" class="btn outline">취소</button>
        <button type="button" class="btn primary btnClose">확인</button>

    </div>
