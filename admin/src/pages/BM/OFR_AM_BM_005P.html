<include src="../../layout/layoutDefault.html" title="공지사항">

  <!-- 페이지 상단 헤더 (좌측: 타이틀 / 우측: 브래드크럼) -->
  <include src="../../partials/pageHeader.html" title="공지사항" breadcrumb=""></include>


  <!-- [팝업] -->
  <!-- [D] 퍼블 확인용 .isOpen 상태로 노출 -->
  <div id="" class="popupDimmed isOpen">
    <div class="popupWrap lg">
      <div class="popupHeader">
        <h2 class="popupTitle">공지사항 등록</h2>
        <button type="button" class="btnClose" aria-label="닫기"></button>
      </div>
      <div class="popupBody">
        <div class="tblSection">
          <include src="../../partials/viewSection.html" title="">
            <tr>
              <th><label class="formLabel" for="noticeTitle">제목 <span class="required">*</span></label></th>
              <td>
                <div class="formControlWrap full">
                  <input type="text" id="noticeTitle" class="formControl full" maxlength="100" placeholder="100자 이내 입력">
                </div>
              </td>
            </tr>
            <tr>
              <th><label class="formLabel" for="noticeContent">내용 <span class="required">*</span></label></th>
              <td>
                <div class="formControlWrap full">
                  <textarea id="noticeContent" class="formControl full" rows="4" maxlength="100" placeholder="1000자 이내 입력"></textarea>
                </div>
              </td>
            </tr>
            <tr>
              <th><label class="formLabel" for="noticeFile">첨부파일</label></th>
              <td>
                <div class="formControlWrap full col">
                  <div class="fileUpload">
                    <input type="file" id="noticeFile" multiple>
                    <input type="text" class="formControl fileUploadInput" placeholder="파일을 선택해주세요" readonly>
                    <label for="noticeFile" class="btn outline fileUploadBtn">파일 추가</label>
                  </div>
                  <span class="formGuideText">※ 10MB 이하 파워포인트, 엑셀, 워드, pdf, jpg, png 파일 총 3개까지 업로드 가능합니다.</span>

                  <!-- [D] 첨부된 파일 목록: 파일 있을 때 노출 -->
                  <ul class="fileList">
                    <li class="fileItem">
                      <div class="fileInfo">
                        <a class="fileName" href="#;">Aaaaaaa.pdf <span class="fileSize">(820KB)</span></a>
                      </div>
                      <button type="button" class="fileDelete">
                        <span class="ico deleteTag"></span>
                      </button>
                    </li>
                  </ul>
                </div>
              </td>
            </tr>
            <tr>
              <th><label class="formLabel">사용여부 <span class="required">*</span></label></th>
              <td>
                <include src="../../partials/checkGroup.html" name="noticeUse" options="사용,미사용" legend="사용여부 선택"></include>
              </td>
            </tr>
            <tr>
              <th><label class="formLabel">상단고정</label></th>
              <td>
                <!-- [D] 고정된 공지 건수 표시 (최대 3건 초과 시 체크 비활성) -->
                <label class="formCheck">
                  <input type="checkbox" name="noticeFixed">
                  <span class="checkIcon"></span>
                  <span class="checkLabel">상단고정(0/최대 3건)</span>
                </label>
              </td>
            </tr>
            <tr>
              <th><label class="formLabel">작성자</label></th>
              <td>홍길동(1234567)/디지털BK Biz부</td>
            </tr>
            <tr>
              <th><label class="formLabel">작성일시</label></th>
              <td>2026.07.07 10:00</td>
            </tr>
          </include>
        </div>
      </div>
      <div class="popupFooter">
        <button type="button" class="btn outline">취소</button>
        <button type="button" class="btn primary btnClose">저장</button>
      </div>
    </div>
  </div>

</include>
