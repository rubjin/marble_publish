<include src="../../layout/layoutDefault.html" title="사용자관리">

  <!-- 페이지 상단 헤더 (좌측: 타이틀 / 우측: 브래드크럼) -->
  <include src="../../partials/pageHeader.html" title="사용자관리" breadcrumb=""></include>


  <!-- [팝업] -->
  <!-- [D] 퍼블 확인용 .isOpen 상태로 노출 -->
  <div id="" class="popupDimmed isOpen">
    <div class="popupWrap lg">
      <div class="popupHeader">
        <h2 class="popupTitle">직원조회</h2>
        <button type="button" class="btnClose" aria-label="닫기"></button>
      </div>
      <div class="popupBody">
        <!-- 상단 검색 조건 -->
        <div class="searchBox singleLine">
          <!-- [D] cols2 : 2분할 (부서명 / 직원명·사번 한 줄 배치) -->
          <div class="searchRow cols2">
            <div class="searchItem">
              <label class="searchLabel" for="staffDept">부서명</label>
              <div class="searchField">
                <div class="formControlWrap">
                  <input type="text" id="staffDept" class="formControl full" placeholder="부서명 입력">
                </div>
              </div>
            </div>
            <div class="searchItem">
              <label class="searchLabel" for="staffName">직원명/사번</label>
              <div class="searchField">
                <div class="formControlWrap">
                  <input type="text" id="staffName" class="formControl full" placeholder="직원명 또는 사번 입력">
                </div>
              </div>
            </div>
          </div>
          <include src="../../partials/searchBtnArea.html" noReset></include>
        </div>

        <div class="tblSection">
          <!-- 테이블 상단 건수 : 건수가 있을때 .point 추가 -->
          <include src="../../partials/tblTop.html" count="20"></include>

          <!-- 직원조회 내역 테이블 -->
          <div class="tblWrap">
            <table class="tbl tblBordered">
              <colgroup>
                <col style="width: 60px;">
                <col style="width: auto;">
                <col style="width: 160px;">
                <col style="width: 160px;">
              </colgroup>
              <thead>
                <tr>
                  <th>선택</th>
                  <th>부서명</th>
                  <th>사번</th>
                  <th>직원명</th>
                </tr>
              </thead>
              <tbody>
                <!-- [D] 행 선택(라디오) 후 확인 클릭 시 선택한 직원 반영 -->
                <tr>
                  <td>
                    <label class="formCheck">
                      <input type="radio" name="staffSelect">
                      <span class="checkIcon"></span>
                    </label>
                  </td>
                  <td>디지털BK Biz부</td>
                  <td>123456</td>
                  <td>김국민</td>
                </tr>
              </tbody>
            </table>
          </div>

          <include src="../../partials/pagination.html"></include>
        </div>
      </div>
      <div class="popupFooter">
        <button type="button" class="btn outline">취소</button>
        <button type="button" class="btn primary btnClose">확인</button>
      </div>
    </div>
  </div>

</include>
