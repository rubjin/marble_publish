<include src="../../layout/layoutDefault.html" title="사용자관리">

  <!-- 페이지 상단 헤더 (좌측: 타이틀 / 우측: 브래드크럼) -->
  <include src="../../partials/pageHeader.html" title="사용자관리" breadcrumb=""></include>


  <!-- [팝업] -->
  <!-- [D] 퍼블 확인용 .isOpen 상태로 노출 -->
  <div id="" class="popupDimmed isOpen">
    <div class="popupWrap lg">
      <div class="popupHeader">
        <h2 class="popupTitle">부점조회</h2>
        <button type="button" class="btnClose" aria-label="닫기"></button>
      </div>
      <div class="popupBody">
        <!-- 상단 검색 조건 -->
        <div class="section searchBox">
          <div class="searchRow">
            <div class="searchItem full">
              <span class="searchLabel">부점명/코드</span>
              <div class="searchField">
                <div class="formRow">
                  <div class="formControlWrap">
                    <input type="text" class="formControl full" placeholder="검색어 2자 이상">
                    <button type="button" class="btn primary">조회</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <!-- 테이블 상단 건수 : 건수가 있을때 .point 추가 -->
          <include src="../../partials/tblTop.html" count="20" pageSize></include>

          <!-- 부점조회 내역 테이블 -->
          <div class="tblWrap">
            <table class="tbl tblBordered">
              <colgroup>
                <col style="width: 60px;">
                <col style="width: 160px;">
                <col style="width: auto;">
                <col style="width: auto;">
              </colgroup>
              <thead>
                <tr>
                  <th>선택</th>
                  <th>부점코드</th>
                  <th>부점명</th>
                  <th>본부</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <label class="formCheck">
                      <input type="radio" name="branchSelect">
                      <span class="checkIcon"></span>
                    </label>
                  </td>
                  <td>123456</td>
                  <td>디지털BK Biz부</td>
                  <td>디지털영업본부</td>
                </tr>
              </tbody>
            </table>
          </div>

          <include src="../../partials/pagination.html"></include>
        </div>
      </div>
      <div class="popupFooter">
        <button type="button" class="btn outline">취소</button>
        <button type="button" class="btn primary btnClose">확인</button>
      </div>
    </div>
  </div>

</include>
