<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트 1: <Table columns={columns} data={data} />
  - 속성 인터페이스 (<Table />):
    * columns: Array<{ title: string; key: string; width?: string; align?: 'left' | 'center' | 'right'; render?: (val, row) => React.ReactNode }>
    * data: Array<Record<string, any>>
    * emptyText?: string (데이터 없을 시 노출 문구)

  - 컴포넌트 2: <TableView items={viewData} colWidths={['140px', 'auto', '140px', 'auto']} />
  - 속성 인터페이스 (<TableView />):
    * 2열 또는 4열의 상세 정보 key-value 테이블
-->

<!-- 1. 기본 데이터 그리드 테이블 (상단 타이틀 & 건수/버튼 + 테이블) -->
<div class="tblSection">
  <div class="tblTop">
    <div class="tblLeft">
      <h3 class="tblTitle">기본 목록</h3>
      <span class="tblCount">총 <strong class="count point">3</strong>건</span>
    </div>
    <div class="tblRight">
      <div class="btnGroup">
        <button type="button" class="btn outline">
          <span class="ico download"></span>
          <span>다운로드</span>
        </button>
      </div>
    </div>
  </div>
  <div class="tblWrap">
    <table class="tbl">
      <colgroup>
        <col style="width: 25%;" />
        <col style="width: 45%;" />
        <col style="width: 30%;" />
      </colgroup>
      <thead>
        <tr>
          <th>헤더1</th>
          <th>헤더2</th>
          <th>헤더3</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>내용1</td>
          <td>내용2</td>
          <td>내용3</td>
        </tr>
        <tr>
          <td>내용1</td>
          <td>내용2</td>
          <td>내용3</td>
        </tr>
        <tr>
          <td>내용1</td>
          <td>내용2</td>
          <td>내용3</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 2. 상세 뷰 테이블 (상세 정보 확인용 키-값 테이블 .tblView) -->
