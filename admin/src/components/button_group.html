<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: 
    1) <ButtonGroup size="sm" | "md" | "lg" align="left" | "right"> {buttons} </ButtonGroup>
    2) <PageBottomAction leftActions={...} rightActions={...} />
  - 속성 인터페이스:
    * size?: 'sm' | 'md' | 'lg' (기본값: 'md', sm: 24px, md: 34px, lg: 40px)
    * align?: 'left' | 'right' | 'center' (align="right" 시 .btnGroupRight 적용)
    * leftActions?: React.ReactNode (페이지 하단 좌측 슬롯 - 목록, 초기화 등)
    * rightActions?: React.ReactNode (페이지 하단 우측 슬롯 - 임시저장, 저장, 등록 등)
    * children?: React.ReactNode
  - 컴포넌트 설명:
    * 테이블 내부 행 액션, 다이얼로그/모달 하단 액션, 페이지 하단 액션 바 등 여러 개의 버튼을 일정한 간격으로 배치하고 정렬하는 컴포넌트입니다.
-->

<!-- 1. 소형 버튼 그룹 (테이블 행 단위 관리 액션용, 높이 24px) -->
<div class="btnGroup sm">
  <button type="button" class="btn outline">수정</button>
  <button type="button" class="btn outline">복사</button>
  <button type="button" class="btn danger">삭제</button>
</div>

<div style="width: 100%; height: 16px;"></div><!-- 구분선 -->

<!-- 2. Default / Medium Button Group (인라인 표준 액션 그룹, 높이 34px) -->
<div class="btnGroup">
  <button type="button" class="btn outline">찾아보기</button>
  <button type="button" class="btn outline">연결 해제</button>
  <button type="button" class="btn primary">조회</button>
</div>

<div style="width: 100%; height: 16px;"></div><!-- 구분선 -->

<!-- 3. Dark & Light Button Group (주요 업무 서브 액션 그룹) -->
<div class="btnGroup">
  <button type="button" class="btn dark">항목 선택</button>
  <button type="button" class="btn dark">파일 선택</button>
  <button type="button" class="btn dark">미리보기</button>
  <button type="button" class="btn dark">+ 단계 추가</button>
</div>

<div style="width: 100%; height: 16px;"></div><!-- 구분선 -->

<!-- 4. Right Aligned Button Group (우측 정렬 버튼 그룹 - 폼/모달 하단 액션용) -->
<div class="btnArea">
  <div class="btnGroup btnGroupRight">
    <button type="button" class="btn outline">취소</button>
    <button type="button" class="btn primary">등록</button>
  </div>
</div>

<div style="width: 100%; height: 16px;"></div><!-- 구분선 -->

<!-- 5. Page Bottom Action Bar (페이지 최하단 표준 액션 바 - 좌측 보조 + 우측 주요 액션) -->
<div class="btnArea pageBottom">
  <div class="btnGroup">
    <button type="button" class="btn outline">목록</button>
    <button type="button" class="btn outline">초기화</button>
  </div>
  <!-- 오른쪽 정렬 버튼 그룹 -->
  <div class="btnGroup btnGroupRight">
    <button type="button" class="btn outline">임시저장</button>
    <button type="button" class="btn primary">저장</button>
  </div>
</div>
