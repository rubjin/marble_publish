<!-- 
  [페이지 패턴 2] 등록 / 수정 상세 폼 & 하단 액션 페이지 패턴
  - 레이아웃 구조:
    1. <PageHeader /> (페이지 타이틀 + 메타 정보)
    2. <SectionBox /> (등록 및 수정 입력 폼 테이블)
    3. <PageBottomAction /> (목록/초기화 + 임시저장/저장)
-->

<style>
  .patternFormColLabel {
    width: 160px;
  }
</style>

<!-- 1. 페이지 헤더 -->
<div class="pageHeader">
  <div class="headerLeft">
    <h2 class="pageTitle">운영 항목 등록 및 수정</h2>
  </div>
  <div class="headerRight">
    <ul class="listBar">
      <li class="listBarItem"><span class="label">작성자</span>:<span class="value">관리자(admin)</span></li>
      <li class="listBarItem"><span class="label">최종수정</span>:<span class="value">2026.08.15 10:30</span></li>
    </ul>
  </div>
</div>

<!-- 2. 입력 폼 영역 -->
<div class="sectionBox">
  <div class="tblSection">
    <div class="tblTop">
      <div class="tblLeft">
        <h3 class="tblTitle">기본 정보 입력</h3>
      </div>
    </div>
    <div class="tblWrap">
      <table class="tbl tblView">
        <colgroup>
          <col class="patternFormColLabel" />
          <col />
        </colgroup>
        <tbody>
          <!-- 2-1. 항목명 -->
          <tr>
            <th><label class="formLabel" for="idItemName">항목명 <span class="required">*</span></label></th>
            <td>
              <input type="text" id="idItemName" class="formControl full" placeholder="항목명을 입력해주세요" value="2026 대표 운영 프로그램" />
            </td>
          </tr>

          <!-- 2-2. 유형 선택 -->
          <tr>
            <th><label class="formLabel" for="idProgramType">유형 선택 <span class="required">*</span></label></th>
            <td>
              <div class="formControlWrap">
                <select id="idProgramType" class="formControl">
                  <option value="">유형을 선택하세요</option>
                  <option value="1" selected>기본 프로그램</option>
                  <option value="2">특별 프로그램</option>
                </select>
              </div>
            </td>
          </tr>

          <!-- 2-3. 운영 기간 -->
          <tr>
            <th><span class="formLabel">운영 기간 <span class="required">*</span></span></th>
            <td>
              <div class="formDateRange">
                <div class="formDatepicker">
                  <input type="text" class="formControl" value="2026.07.01" title="운영 시작일" />
                  <button type="button" class="btnCalendar" aria-label="달력 열기"></button>
                </div>
                <span class="dateSeparator">~</span>
                <div class="formDatepicker">
                  <input type="text" class="formControl" value="2026.08.31" title="운영 종료일" />
                  <button type="button" class="btnCalendar" aria-label="달력 열기"></button>
                </div>
              </div>
            </td>
          </tr>

          <!-- 2-4. 지급 한도 금액 -->
          <tr>
            <th><label class="formLabel" for="idPayLimit">지급 한도 금액</label></th>
            <td>
              <div class="formControlWrap hasUnit">
                <input type="text" id="idPayLimit" class="formControl" value="50,000,000" />
                <span class="inputUnit">원</span>
              </div>
            </td>
          </tr>

          <!-- 2-5. 연결 태그 설정 -->
          <tr>
            <th><span class="formLabel">연결 태그 설정</span></th>
            <td>
              <div class="formControlWrap full col">
                <div class="tagBox">
                  <span class="tagChip">메인 홈 <button type="button" class="tagDelete" aria-label="삭제"></button></span>
                  <span class="tagChip">이벤트 존 <button type="button" class="tagDelete" aria-label="삭제"></button></span>
                  <span class="tagChip">혜택 안내 <button type="button" class="tagDelete" aria-label="삭제"></button></span>
                </div>
                <div class="formControlBottom">
                  <span class="formGuideText">노출할 화면 위치를 지정합니다.</span>
                  <button type="button" class="btn dark">항목 선택</button>
                </div>
              </div>
            </td>
          </tr>

          <!-- 2-6. 상세 안내 설명 (Textarea) -->
          <tr>
            <th><label class="formLabel" for="idDetailDesc">상세 안내 설명</label></th>
            <td>
              <div class="formControlWrap full">
                <textarea id="idDetailDesc" class="formControl" rows="4" placeholder="상세 설명을 입력해주세요">참여 고객을 대상으로 자동 정산되는 표준 운영 프로그램입니다.</textarea>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 3. 페이지 하단 액션 버튼 바 -->
<div class="btnArea pageBottom">
  <div class="btnGroup">
    <button type="button" class="btn outline">목록</button>
    <button type="button" class="btn outline">초기화</button>
  </div>
  <div class="btnGroup btnGroupRight">
    <button type="button" class="btn outline">임시저장</button>
    <button type="button" class="btn primary">저장</button>
  </div>
</div>
