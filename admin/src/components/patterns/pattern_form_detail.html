<!-- 
  [페이지 패턴 2] 등록 / 수정 상세 폼 & 하단 액션 페이지 패턴
  - 레이아웃 구조:
    1. <PageHeader /> (페이지 타이틀 + 메타 정보)
    2. <FormGroup /> (필수 텍스트 인풋, 셀렉트, 단위 인풋, 태그박스, 파일업로드)
    3. <PageBottomAction /> (목록/초기화 + 임시저장/저장)
-->

<!-- 1. 페이지 헤더 -->
<div class="pageHeader">
  <div class="headerLeft">
    <h2 class="pageTitle">운영 항목 등록 및 수정</h2>
  </div>
  <div class="headerRight">
    <ul class="listBar">
      <li class="listBarItem"><span class="label">작성자</span>:<span class="value">관리자(admin)</span></li>
      <li class="listBarItem"><span class="label">최종수정</span>:<span class="value">2026.08.15 10:30</span></li>
    </ul>
  </div>
</div>

<!-- 2. 입력 폼 영역 -->
<div style="background: #fff; padding: 32px; border-radius: 12px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; gap: 24px; width: 100%; box-sizing: border-box;">
  
  <!-- 2-1. 기본 정보 입력 -->
  <div class="formGroup">
    <label class="formLabel">항목명 <span class="required">*</span></label>
    <div class="formControlWrap full">
      <input type="text" class="formControl" placeholder="항목명을 입력해주세요" value="2026 대표 운영 프로그램" />
    </div>
  </div>

  <!-- 2-2. 2열 구성 (유형 셀렉트 + 운영 기간) -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <div class="formGroup">
      <label class="formLabel">유형 선택 <span class="required">*</span></label>
      <div class="formControlWrap full">
        <select class="formControl">
          <option value="">유형을 선택하세요</option>
          <option value="1" selected>기본 프로그램</option>
          <option value="2">특별 프로그램</option>
        </select>
      </div>
    </div>

    <div class="formGroup">
      <label class="formLabel">운영 기간 <span class="required">*</span></label>
      <div class="formDateRange">
        <div class="formDatepicker">
          <input type="text" class="formControl" value="2026.07.01" />
          <button type="button" class="btnCalendar"></button>
        </div>
        <span class="dateSeparator">~</span>
        <div class="formDatepicker">
          <input type="text" class="formControl" value="2026.08.31" />
          <button type="button" class="btnCalendar"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- 2-3. 수량 및 금액 단위 인풋 -->
  <div class="formGroup">
    <label class="formLabel">지급 한도 금액</label>
    <div class="formControlWrap full hasUnit">
      <input type="text" class="formControl" value="50,000,000" style="text-align: right;" />
      <span class="unit">원</span>
    </div>
  </div>

  <!-- 2-4. 태그 지정 박스 -->
  <div class="formGroup">
    <label class="formLabel">연결 태그 설정</label>
    <div class="formControlWrap full col">
      <div class="tagBox">
        <span class="tagChip">메인 홈 <button type="button" class="tagDelete"></button></span>
        <span class="tagChip">이벤트 존 <button type="button" class="tagDelete"></button></span>
        <span class="tagChip">혜택 안내 <button type="button" class="tagDelete"></button></span>
      </div>
      <div class="formControlBottom">
        <span class="formGuideText">노출할 화면 위치를 지정합니다.</span>
        <button type="button" class="btn dark">항목 선택</button>
      </div>
    </div>
  </div>

  <!-- 2-5. 상세 내용 (Textarea) -->
  <div class="formGroup">
    <label class="formLabel">상세 안내 설명</label>
    <div class="formControlWrap full">
      <textarea class="formControl" rows="4" placeholder="상세 설명을 입력해주세요">참여 고객을 대상으로 자동 정산되는 표준 운영 프로그램입니다.</textarea>
    </div>
  </div>

</div>

<!-- 3. 페이지 하단 액션 버튼 바 -->
<div class="btnArea pageBottom">
  <div class="btnGroup">
    <button type="button" class="btn outline">목록</button>
    <button type="button" class="btn outline">초기화</button>
  </div>
  <div class="btnGroup btnGroupRight">
    <button type="button" class="btn outline">임시저장</button>
    <button type="button" class="btn primary">저장</button>
  </div>
</div>
