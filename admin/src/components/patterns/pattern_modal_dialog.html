<!-- 
  [Page Pattern 4] 모달 다이얼로그 폼 및 확인 팝업 패턴
  - Layout Structure:
    1. <ConfirmDialog /> (확인/취소 안내 모달)
    2. <FormDialog /> (모달 내 테이블 뷰 및 폼 입력 결합)
-->

<!-- Pattern 4-1: 상세 확인 팝업 (Confirm Dialog) -->
<div class="popupDimmed isOpen" style="position: relative; display: flex; width: 100%; height: 320px;">
  <div class="popupWrap">
    <div class="popupHeader">
      <h2 class="popupTitle">운영 상태 변경 확인</h2>
      <button type="button" class="btnClose"></button>
    </div>
    <div class="popupBody">
    </div>
    <div class="popupFooter">
      <button type="button" class="btn outline">취소</button>
      <button type="button" class="btn primary">확인</button>
    </div>
  </div>
</div>

<!-- Pattern 4-2: 폼 결합 상세 모달 팝업 (Large Form Dialog) -->
<div class="popupDimmed isOpen" style="position: relative; display: flex; width: 100%; height: 420px;">
  <div class="popupWrap lg">
    <div class="popupHeader">
      <h2 class="popupTitle">항목 상세 정보 및 수정</h2>
      <button type="button" class="btnClose"></button>
    </div>
    <div class="popupBody">
      <!-- 상세 뷰 테이블 -->
      <table class="tbl tblView">
        <colgroup>
          <col style="width: 120px;" />
          <col />
          <col style="width: 120px;" />
          <col />
        </colgroup>
        <tbody>
          <tr>
            <th>등록코드</th>
            <td>CD-20260908</td>
            <th>최초등록자</th>
            <td>관리자(admin)</td>
          </tr>
          <tr>
            <th>진행상태</th>
            <td><span class="statusDot ing">운영중</span></td>
            <th>최종수정일</th>
            <td>2026.09.08 14:00</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="popupFooter">
      <button type="button" class="btn outline">취소</button>
      <button type="button" class="btn primary">저장</button>
    </div>
  </div>
</div>
