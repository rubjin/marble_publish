<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <Icon name="..." size="default" /> 또는 <SidebarMenuIcon index={1..7} />
  - 속성 인터페이스:
    * name: string (e.g., 'calendar', 'download', 'logout', 'deleteTag', 'upload', 'drag', 'side1'~'side7', 'sideSub')
    * size?: 'sm' | 'default' | 'md' | 'lg' | 'xl'
      - sm: 16px
      - default: 20px
      - md: 24px
      - lg: 30px
      - xl: 36px
    * className?: string
-->

<!-- 1. Small (16px) -->
<span class="ico sm calendar"></span>
<span class="ico sm download"></span>

<!-- 2. Default (20px) -->
<span class="ico logout"></span>
<span class="ico deleteTag"></span>
<span class="ico statusIng"></span>
<span class="ico statusAlarm"></span>
<span class="ico statusRate"></span>
<span class="ico statusAdd"></span>
<span class="ico statusPoint"></span>
<span class="ico select"></span>

<!-- 3. Medium (24px) -->
<span class="ico md breadcrumb"></span>
<span class="ico md checkbox"></span>
<span class="ico md checkboxChecked"></span>
<span class="ico md radio"></span>
<span class="ico md radioChecked"></span>
<span class="ico md deleteFile"></span>

<!-- 4. Large (30px) -->
<span class="ico lg drag"></span>

<!-- 5. X-Large (36px) -->
<span class="ico xl upload"></span>

<div style="width: 100%; height: 2px;"></div><!-- 구분선 -->

<!-- 6. Sidebar Menu Icons (사이드바 대메뉴 및 서브메뉴 아이콘) -->
<!-- 1depth 사이드바 대메뉴 아이콘 (20px x 20px) -->
<span class="ico side1"></span>
<span class="ico side2"></span>
<span class="ico side3"></span>
<span class="ico side4"></span>
<span class="ico side5"></span>
<span class="ico side6"></span>
<span class="ico side7"></span>

<!-- 2depth 서브메뉴 불릿 아이콘 -->
<span class="ico sideSub"></span>
