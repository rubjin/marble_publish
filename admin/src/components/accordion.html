<!-- 
  [React Component Guide]
  - Component: <Accordion title="..." isOpen={isOpen} onToggle={...}> {children} </Accordion>
    또는 <AccordionGroup activeKey={...} onToggle={...}> ... </AccordionGroup>
  - Props Interface:
    * title: string | React.ReactNode (헤더 영역 타이틀)
    * isOpen: boolean (controlled 열림 상태, .isOpen 클래스 바인딩)
    * onToggle: (isOpen: boolean) => void (헤더 클릭 시 호출)
    * children: React.ReactNode (본문 영역 .accordionBody)
    * disabled?: boolean
  - State Classes:
    * .accordion.isOpen : 아코디언 본문 펼침 상태 (우측 화살표 180도 회전)
-->

<!-- Case 1: 아코디언 (열림 상태: .isOpen 클래스 추가) -->
<div class="accordion isOpen">
  <button type="button" class="accordionHeader" aria-expanded="true">
    <span>아코디언 제목 1 (열림)</span>
    <span class="accordionArrow"></span>
  </button>
  <div class="accordionBody">
    <p>아코디언 내용입니다. 여기에 텍스트, 이미지, 폼 등 다양한 콘텐츠를 넣을 수 있습니다.</p>
  </div>
</div>

<!-- Case 2: 아코디언 (닫힘 상태: 기본) -->
<div class="accordion">
  <button type="button" class="accordionHeader" aria-expanded="false">
    <span>아코디언 제목 2 (닫힘)</span>
    <span class="accordionArrow"></span>
  </button>
  <div class="accordionBody">
    <p>두 번째 아코디언의 내용입니다.</p>
  </div>
</div>

<!-- Case 3: 아코디언 (닫힘 상태) -->
<div class="accordion">
  <button type="button" class="accordionHeader" aria-expanded="false">
    <span>아코디언 제목 3 (닫힘)</span>
    <span class="accordionArrow"></span>
  </button>
  <div class="accordionBody">
    <p>세 번째 아코디언의 내용입니다.</p>
  </div>
</div>
