<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <ProgressBar value={70} max={100} showValue={true} />
  - 속성 인터페이스:
    * value: number (현재 값, 0 ~ max)
    * max?: number (최대 값, 기본값: 100)
    * showValue?: boolean (백분율 텍스트 표시 여부, 기본값: false)
    * className?: string
  - 스타일 바인딩:
    * .barPercentFill 의 style="width: ${ (value / max) * 100 }%" 로 동적 바인딩
-->

<!-- Case 1: 기본 프로그레스 바 (진행률 게이지 바만 표시) -->
<div class="barPercent">
  <div class="barPercentTrack">
    <div class="barPercentFill" style="width: 70%;"></div>
  </div>
</div>
