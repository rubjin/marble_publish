<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <ToggleSwitch checked={checked} onChange={setChecked} label="..." />
  - 속성 인터페이스:
    * checked: boolean (체크 상태 제어)
    * onChange: (checked: boolean, e: React.ChangeEvent<HTMLInputElement>) => void
    * label?: string | React.ReactNode (텍스트 라벨)
    * variant?: 'default' | 'primary' (기본값: 'default', 'primary'는 노란색 활성)
    * size?: 'sm' | 'md' | 'lg' (기본값: 'md')
    * disabled?: boolean (기본값: false)
    * name?: string
    * id?: string
  - 상태 클래스 및 속성:
    * input[type="checkbox"]:checked : ON 상태
    * input:disabled, .isDisabled : 비활성화 상태
-->

<!-- 기본 토글 스위치 (기본 및 Primary) -->
<div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap;">
  <!-- Case 1-1: OFF 상태 -->
  <label class="toggle">
    <input type="checkbox" />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">비활성 (OFF)</span>
  </label>

  <!-- Case 1-2: ON 상태 -->
  <label class="toggle">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">활성 (ON)</span>
  </label>

  <!-- Case 1-3: Primary 컬러 테마 -->
  <label class="toggle primary">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Primary 컬러</span>
  </label>
</div>

<!-- Sizes (사이즈 변형) -->
<div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 16px;">
  <!-- Case 2-1: Small (sm) -->
  <label class="toggle sm">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Small (sm)</span>
  </label>

  <!-- Case 2-2: Medium (Default) -->
  <label class="toggle">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Default (기본)</span>
  </label>

  <!-- Case 2-3: Large (lg) -->
  <label class="toggle lg">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Large (lg)</span>
  </label>
</div>

<!-- States (Disabled 상태) -->
<div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 16px;">
  <!-- Case 3-1: Disabled OFF -->
  <label class="toggle">
    <input type="checkbox" disabled />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Disabled (OFF)</span>
  </label>

  <!-- Case 3-2: Disabled ON -->
  <label class="toggle">
    <input type="checkbox" checked disabled />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Disabled (ON)</span>
  </label>
</div>

<!--
  [선택 토글 (Toggle Group)]
  - 2지선다 선택 (예: 당일 / 당월) - 선택 항목 엘로우(primary) 컬러
  - .toggleGroup > label.toggleItem > input[type="radio"] + .toggleText
  - 같은 그룹의 radio 는 name 동일하게 (화면 안에서 중복되지 않게)
  - 상태: input:checked (선택) / input:disabled (비활성)
-->
<div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 16px;">
  <!-- Case: 당일 선택 -->
  <div class="toggleGroup" role="radiogroup" aria-label="조회 기간 선택">
    <label class="toggleItem"><input type="radio" name="periodToggle1" checked><span class="toggleText">당일</span></label>
    <label class="toggleItem"><input type="radio" name="periodToggle1"><span class="toggleText">당월</span></label>
  </div>

  <!-- Case: 당월 선택 -->
  <div class="toggleGroup" role="radiogroup" aria-label="조회 기간 선택">
    <label class="toggleItem"><input type="radio" name="periodToggle2"><span class="toggleText">당일</span></label>
    <label class="toggleItem"><input type="radio" name="periodToggle2" checked><span class="toggleText">당월</span></label>
  </div>

  <!-- Case: Disabled -->
  <div class="toggleGroup" role="radiogroup" aria-label="조회 기간 선택">
    <label class="toggleItem"><input type="radio" name="periodToggle3" checked disabled><span class="toggleText">당일</span></label>
    <label class="toggleItem"><input type="radio" name="periodToggle3" disabled><span class="toggleText">당월</span></label>
  </div>
</div>
