<!-- 
  [React Component Guide]
  - Component: <ToggleSwitch checked={checked} onChange={setChecked} label="..." />
  - Props Interface:
    * checked: boolean (controlled checked state)
    * onChange: (checked: boolean, e: React.ChangeEvent<HTMLInputElement>) => void
    * label?: string | React.ReactNode (텍스트 라벨)
    * variant?: 'default' | 'primary' (default: 'default', 'primary'는 노란색 활성)
    * size?: 'sm' | 'md' | 'lg' (default: 'md')
    * disabled?: boolean (default: false)
    * name?: string
    * id?: string
  - State Classes / Attributes:
    * input[type="checkbox"]:checked : ON 상태
    * input:disabled, .isDisabled : 비활성화 상태
-->

<!-- 1. 기본 토글 스위치 (Default & Primary) -->
<div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap;">
  <!-- Case 1-1: OFF 상태 -->
  <label class="toggle">
    <input type="checkbox" />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">비활성 (OFF)</span>
  </label>

  <!-- Case 1-2: ON 상태 -->
  <label class="toggle">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">활성 (ON)</span>
  </label>

  <!-- Case 1-3: Primary 컬러 테마 -->
  <label class="toggle primary">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Primary 컬러</span>
  </label>
</div>

<!-- 2. Sizes (사이즈 변형) -->
<div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 16px;">
  <!-- Case 2-1: Small (sm) -->
  <label class="toggle sm">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Small (sm)</span>
  </label>

  <!-- Case 2-2: Medium (Default) -->
  <label class="toggle">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Default (기본)</span>
  </label>

  <!-- Case 2-3: Large (lg) -->
  <label class="toggle lg">
    <input type="checkbox" checked />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Large (lg)</span>
  </label>
</div>

<!-- 3. States (Disabled 상태) -->
<div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 16px;">
  <!-- Case 3-1: Disabled OFF -->
  <label class="toggle">
    <input type="checkbox" disabled />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Disabled (OFF)</span>
  </label>

  <!-- Case 3-2: Disabled ON -->
  <label class="toggle">
    <input type="checkbox" checked disabled />
    <span class="toggleTrack"></span>
    <span class="toggleLabel">Disabled (ON)</span>
  </label>
</div>
