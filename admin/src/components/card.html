<!-- ==========================================================================
  KPI / 통계 요약 카드 (좌측: 타이틀 / 우측: 금액·수치 & 비교값 정렬)
  ========================================================================== -->

<!-- 1. 4단 그리드 (총 예산한도, 지급금액, 잔여한도, 전체 소진율) -->
<div class="kpiCardGrid">
  <!-- 1. 총 예산한도 -->
  <div class="kpiCard">
    <span class="kpiTitle">총 예산한도</span>
    <div class="kpiContent">
      <div class="kpiNumber">
        <strong>100,000,000</strong><span class="unit">원</span>
      </div>
      <p class="kpiSub">(전년 대비 0원 / <span class="rate isUp">+00.0%</span>)</p>
    </div>
  </div>

  <!-- 2. 지급금액 -->
  <div class="kpiCard">
    <span class="kpiTitle">지급금액</span>
    <div class="kpiContent">
      <div class="kpiNumber">
        <strong>50,000,000</strong><span class="unit">원</span>
      </div>
      <p class="kpiSub">(전년 대비 0원 / <span class="rate isUp">+00.0%</span>)</p>
    </div>
  </div>

  <!-- 3. 잔여한도 -->
  <div class="kpiCard">
    <span class="kpiTitle">잔여한도</span>
    <div class="kpiContent">
      <div class="kpiNumber">
        <strong>10,000,000</strong><span class="unit">원</span>
      </div>
      <p class="kpiSub">(전년 대비 0원 / <span class="rate isUp">+00.0%</span>)</p>
    </div>
  </div>

  <!-- 4. 전체 소진율 -->
  <div class="kpiCard">
    <span class="kpiTitle">전체 소진율</span>
    <div class="kpiContent">
      <div class="kpiNumber">
        <strong>60</strong><span class="unit">%</span>
      </div>
      <p class="kpiSub">(전년 대비 0원 / <span class="rate isUp">+00.0%</span>)</p>
    </div>
  </div>
</div>
