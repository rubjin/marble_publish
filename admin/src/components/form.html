<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트 1: <FormItem label="..." required={true} error="..." helperText="..."> {inputElement} </FormItem>
  - 컴포넌트 2: <Input type="text" placeholder="..." value={val} onChange={...} isError={...} />
  - 컴포넌트 3: <Select options={options} value={selected} onChange={...} placeholder="선택" />
  - 컴포넌트 4: <Textarea value={text} onChange={...} maxLength={1000} placeholder="..." />
  - 컴포넌트 5: <FileInput files={fileList} onSelect={...} onRemove={...} accept=".pdf,.xlsx" boxType />
      .fileUpload (input[type=file] + .fileUploadInput 선택 파일명 + .fileUploadBtn) + .fileList.boxType (박스형 목록)
      files 형태는 fileupload.html 과 동일: Array<{ id; name; size: number(byte); url? }>
  - 속성 인터페이스:
    * label?: string | React.ReactNode (라벨 텍스트)
    * required?: boolean (필수 표시 <span class="required">*</span> 추가)
    * error?: string (에러 상태 .isError 추가 및 <p class="formErrorMsg">{error}</p> 노출)
    * disabled?: boolean (비활성화 상태)
    * readOnly?: boolean (읽기 전용 상태)
-->

<!-- 텍스트 입력 (기본 및 필수 항목) -->
<div class="formGroup">
  <label class="formLabel">텍스트 입력 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" placeholder="내용을 입력해주세요" />
  </div>
</div>

<!-- 텍스트 입력 (유효성 에러 상태: .isError + .formErrorMsg) -->
<div class="formGroup">
  <label class="formLabel">폼 타이틀 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <input type="text" class="formControl isError" placeholder="내용을 입력해주세요" value="입력값" />
  </div>
  <p class="formErrorMsg">올바른 형식으로 입력해주세요.</p>
</div>

<!-- 텍스트 입력 (읽기 전용 / 비활성화) -->
<div class="formGroup">
  <label class="formLabel">읽기 전용 항목 (Readonly)</label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" value="수정할 수 없는 고정값입니다." readonly />
  </div>
</div>

<div class="formGroup">
  <label class="formLabel">비활성화 항목 (Disabled)</label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" value="비활성화된 입력필드" disabled />
  </div>
</div>

<!-- 셀렉트 박스 (드롭다운 선택) -->
<div class="formGroup">
  <label class="formLabel">옵션 선택 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <select class="formControl">
      <option value="">선택해주세요</option>
      <option value="1">옵션 1</option>
      <option value="2">옵션 2</option>
      <option value="3">옵션 3</option>
    </select>
  </div>
</div>

<!-- 텍스트에어리어 (멀티라인 입력) -->
<div class="formGroup">
  <label class="formLabel">상세 내용</label>
  <div class="formControlWrap full">
    <textarea class="formControl" rows="4" placeholder="상세 내용을 입력해주세요 (최대 1000자)"></textarea>
  </div>
</div>

<!-- 첨부파일 (인풋형 선택 + 박스형 목록: .fileList.boxType) -->
<div class="formGroup">
  <label class="formLabel" for="formAttachFile">첨부파일</label>
  <div class="formControlWrap full col">
    <div class="fileUpload">
      <input type="file" id="formAttachFile" multiple />
      <input type="text" class="formControl fileUploadInput" placeholder="파일을 선택해주세요" readonly aria-label="선택된 파일" />
      <label for="formAttachFile" class="btn outline fileUploadBtn">파일 선택</label>
    </div>

    <!-- [D] 첨부된 파일 목록: 파일 있을 때 노출 / 박스형: .boxType -->
    <ul class="fileList boxType">
      <li class="fileItem">
        <div class="fileInfo">
          <a class="fileName" href="#;">이벤트 안내문.pdf <span class="fileSize">(820KB)</span></a>
        </div>
        <button type="button" class="fileDelete" aria-label="이벤트 안내문.pdf 삭제">
          <span class="ico deleteTag"></span>
        </button>
      </li>
      <li class="fileItem">
        <div class="fileInfo">
          <a class="fileName" href="#;">참여자 명단.xlsx <span class="fileSize">(1.2MB)</span></a>
        </div>
        <button type="button" class="fileDelete" aria-label="참여자 명단.xlsx 삭제">
          <span class="ico deleteTag"></span>
        </button>
      </li>
    </ul>
    <span class="formGuideText">PDF, XLSX / 파일당 최대 10MB / 최대 5개</span>
  </div>
</div>
