<!-- 
  [D] 폼 컴포넌트 개발 가이드
  - 기본 구조: 단독/세로 폼은 <div class="formGroup">으로 감싸 일관된 간격(margin-bottom)을 유지합니다.
  - 에러 상태: input/select/textarea에 'isError' 클래스 추가 & <p class="formErrorMsg">를 formControlWrap 하단에 배치
  - 비활성화 상태: input에 'disabled' 속성 추가
  - 읽기전용 상태: input에 'readonly' 속성 추가
  - 단위(Unit): 우측 단위 '.formControlWrap.hasUnit', 좌측 단위 '.formControlWrap.hasPrefix'
  - 버튼 결합: '.formControlWrap.hasBtn'
  - 셀렉트 열림/포커스: select에 'isOpen' 클래스 추가 시 상단 화살표로 반전
-->

<!-- 1. Text Input (기본) -->
<div class="formGroup">
  <label class="formLabel">텍스트 입력 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" placeholder="내용을 입력해주세요">
  </div>
</div>

<!-- 2. Text Input (에러 상태: isError + .formErrorMsg) -->
<div class="formGroup">
  <label class="formLabel">폼 타이틀 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <!-- [D] 에러 상태: isError 클래스 추가 -->
    <input type="email" class="formControl isError" placeholder="placeholder" value="value">
  </div>
  <p class="formErrorMsg">유효하지 않은 형식입니다.</p>
</div>

<!-- 3. Text Input (읽기 전용: readonly) -->
<div class="formGroup">
  <label class="formLabel">폼 타이틀 (읽기 전용)</label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" value="readonly" readonly>
  </div>
</div>

<!-- 4. Textarea (멀티라인 입력) -->
<div class="formGroup">
  <label class="formLabel">상세 내용</label>
  <div class="formControlWrap full">
    <textarea class="formControl" placeholder="상세 내용을 입력해주세요 (최대 1000자)"></textarea>
  </div>
</div>

<!-- 5. Checkbox Group -->
<fieldset class="formGroup">
  <legend class="formLabel">체크박스 그룹</legend>
  <div class="formCheckGroup">
    <label class="formCheck">
      <input type="checkbox" checked>
      <span class="checkIcon"></span>
      <span class="checkLabel">체크박스1</span>
    </label>
    <label class="formCheck">
      <input type="checkbox">
      <span class="checkIcon"></span>
      <span class="checkLabel">체크박스2</span>
    </label>
    <label class="formCheck">
      <input type="checkbox" disabled checked>
      <span class="checkIcon"></span>
      <span class="checkLabel">체크박스 (disabled checked)</span>
    </label>
    <label class="formCheck">
      <input type="checkbox" disabled>
      <span class="checkIcon"></span>
      <span class="checkLabel">체크박스 (disabled)</span>
    </label>
  </div>
</fieldset>

<!-- 6. Radio Group -->
<fieldset class="formGroup">
  <legend class="formLabel">라디오 그룹</legend>
  <div class="formCheckGroup">
    <label class="formCheck">
      <input type="radio" name="publicState" checked>
      <span class="checkIcon"></span>
      <span class="checkLabel">라디오1</span>
    </label>
    <label class="formCheck">
      <input type="radio" name="publicState">
      <span class="checkIcon"></span>
      <span class="checkLabel">라디오2</span>
    </label>
    <label class="formCheck">
      <input type="radio" name="publicStateDisabled" disabled checked>
      <span class="checkIcon"></span>
      <span class="checkLabel">라디오1 (disabled checked)</span>
    </label>
    <label class="formCheck">
      <input type="radio" name="publicStateDisabled" disabled>
      <span class="checkIcon"></span>
      <span class="checkLabel">라디오2 (disabled)</span>
    </label>
  </div>
</fieldset>

<!-- 7. Radio Card Group (라디오 카드형 그룹 - 기본형) -->
<fieldset class="formGroup">
  <legend class="formLabel">타입 선택 (라디오 카드형)</legend>
  <div class="formRadioCardGroup">
    <label class="formRadioCard isActive">
      <input type="radio" name="cardTypeDemo" checked>
      <span class="checkIcon"></span>
      <div class="cardContent">
        <strong class="cardTitle">A-type (본문 삽입형)</strong>
        <p class="cardDesc">질문과 버튼만 노출되는 기본형 레이아웃입니다.</p>
      </div>
    </label>
    <label class="formRadioCard">
      <input type="radio" name="cardTypeDemo">
      <span class="checkIcon"></span>
      <div class="cardContent">
        <strong class="cardTitle">B-type (단독 화면 호출형)</strong>
        <p class="cardDesc">단독 전체 화면에 사용되는 레이아웃입니다.</p>
      </div>
    </label>
  </div>
</fieldset>

<!-- 8. Radio Card Group (라디오 카드형 그룹 - Compact형) -->
<fieldset class="formGroup">
  <legend class="formLabel">정답 선택 (컴팩트 카드형)</legend>
  <div class="formRadioCardGroup">
    <label class="formRadioCard isCompact isActive">
      <input type="radio" name="compactCardDemo" checked>
      <span class="checkIcon"></span>
      <div class="cardContent">
        <strong class="cardTitle">O (정답)</strong>
      </div>
    </label>
    <label class="formRadioCard isCompact">
      <input type="radio" name="compactCardDemo">
      <span class="checkIcon"></span>
      <div class="cardContent">
        <strong class="cardTitle">X (오답)</strong>
      </div>
    </label>
  </div>
</fieldset>
