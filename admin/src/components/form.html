<!-- 
  [React Component Guide]
  - Component 1: <FormItem label="..." required={true} error="..." helperText="..."> {inputElement} </FormItem>
  - Component 2: <Input type="text" placeholder="..." value={val} onChange={...} isError={...} hasUnit="원" />
  - Component 3: <Select options={options} value={selected} onChange={...} placeholder="선택" />
  - Component 4: <Textarea value={text} onChange={...} maxLength={1000} placeholder="..." />
  - Props Interface:
    * label?: string | React.ReactNode
    * required?: boolean (adds <span class="required">*</span>)
    * error?: string (adds .isError on control and renders <p class="formErrorMsg">{error}</p>)
    * disabled?: boolean
    * readOnly?: boolean
    * hasUnit?: string (wraps in .formControlWrap.hasUnit with <span class="unit">)
    * hasBtn?: React.ReactNode (wraps in .formControlWrap.hasBtn with <button type="button" class="btn">)
-->

<!-- 1. Text Input (기본 및 필수 항목) -->
<div class="formGroup">
  <label class="formLabel">텍스트 입력 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" placeholder="내용을 입력해주세요" />
  </div>
</div>

<!-- 2. Text Input (유효성 에러 상태: .isError + .formErrorMsg) -->
<div class="formGroup">
  <label class="formLabel">폼 타이틀 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <!-- [D] 에러 상태: input에 .isError 클래스 추가 -->
    <input type="text" class="formControl isError" placeholder="내용을 입력해주세요" value="입력값" />
  </div>
  <p class="formErrorMsg">올바른 형식으로 입력해주세요.</p>
</div>

<!-- 3. Text Input (읽기 전용: readonly / 비활성화: disabled) -->
<div class="formGroup">
  <label class="formLabel">읽기 전용 항목 (Readonly)</label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" value="수정할 수 없는 고정값입니다." readonly />
  </div>
</div>

<div class="formGroup">
  <label class="formLabel">비활성화 항목 (Disabled)</label>
  <div class="formControlWrap full">
    <input type="text" class="formControl" value="비활성화된 입력필드" disabled />
  </div>
</div>

<!-- 4. Select Box (드롭다운 선택) -->
<div class="formGroup">
  <label class="formLabel">옵션 선택 <span class="required">*</span></label>
  <div class="formControlWrap full">
    <select class="formControl">
      <option value="">선택해주세요</option>
      <option value="1">옵션 1</option>
      <option value="2">옵션 2</option>
      <option value="3">옵션 3</option>
    </select>
  </div>
</div>

<!-- 5. 단위 결합 인풋 (.hasUnit) -->
<div class="formGroup">
  <label class="formLabel">단위 입력 (.hasUnit)</label>
  <div class="formControlWrap full hasUnit">
    <input type="text" class="formControl" placeholder="0" />
    <span class="unit">원</span>
  </div>
</div>

<!-- 6. 버튼 결합 인풋 (.hasBtn) -->
<div class="formGroup">
  <label class="formLabel">버튼 결합 입력 (.hasBtn)</label>
  <div class="formControlWrap full hasBtn">
    <input type="text" class="formControl" placeholder="내용을 입력해주세요" />
    <button type="button" class="btn dark">확인</button>
  </div>
</div>

<!-- 7. Textarea (멀티라인 입력) -->
<div class="formGroup">
  <label class="formLabel">상세 내용</label>
  <div class="formControlWrap full">
    <textarea class="formControl" rows="4" placeholder="상세 내용을 입력해주세요 (최대 1000자)"></textarea>
  </div>
</div>
