<!-- 
  [React Component Guide]
  - Component: <Tooltip content="..." position="top" multiLine={false}> {children} </Tooltip>
  - Props Interface:
    * content: string | React.ReactNode (말풍선 내 텍스트/요소)
    * position?: 'top' | 'bottom' | 'left' | 'right' (default: 'top')
    * multiLine?: boolean (default: false, 긴 텍스트 줄바꿈 .multiLine)
    * isOpen?: boolean (controlled visible, .isOpen 클래스 부여)
    * children: React.ReactNode (트리거 요소)
  - State Classes:
    * .tooltipWrap.isOpen : 마우스 호버 없이 상시 노출 상태
-->

<!-- 1. 기본 아이콘 툴팁 (방향별: top / bottom / left / right) -->
<div style="display: flex; gap: 40px; align-items: center; flex-wrap: wrap; padding: 40px 20px;">
  <!-- Case 1-1: Top (상단 기본) -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>상단 툴팁</span>
    <div class="tooltipWrap top">
      <button type="button" class="tooltipBtn">?</button>
      <div class="tooltipContent">상단에 노출되는 설명 툴팁입니다.</div>
    </div>
  </div>

  <!-- Case 1-2: Bottom (하단) -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>하단 툴팁</span>
    <div class="tooltipWrap bottom">
      <button type="button" class="tooltipBtn">?</button>
      <div class="tooltipContent">하단에 노출되는 설명 툴팁입니다.</div>
    </div>
  </div>

  <!-- Case 1-3: Left (좌측) -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>좌측 툴팁</span>
    <div class="tooltipWrap left">
      <button type="button" class="tooltipBtn">?</button>
      <div class="tooltipContent">좌측 설명 툴팁입니다.</div>
    </div>
  </div>

  <!-- Case 1-4: Right (우측) -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>우측 툴팁</span>
    <div class="tooltipWrap right">
      <button type="button" class="tooltipBtn">?</button>
      <div class="tooltipContent">우측 설명 툴팁입니다.</div>
    </div>
  </div>
</div>

<!-- 2. 버튼 트리거 툴팁 및 다중 라인 (Multi-line) -->
<div style="display: flex; gap: 30px; align-items: center; flex-wrap: wrap; padding: 10px 20px;">
  <!-- Case 2-1: 버튼 트리거 툴팁 -->
  <div class="tooltipWrap top">
    <button type="button" class="btn outline">마우스를 올려보세요</button>
    <div class="tooltipContent">클릭 시 상세 모달이 열립니다.</div>
  </div>

  <!-- Case 2-2: 다중 라인 툴팁 (.multiLine) -->
  <div class="tooltipWrap bottom">
    <button type="button" class="btn primary">안내 정보</button>
    <div class="tooltipContent multiLine">
      최대 3줄까지 입력 가능한 긴 설명 툴팁입니다. 자동 줄바꿈이 적용됩니다.
    </div>
  </div>
</div>
