<!-- 
  [D] 툴팁 컴포넌트 개발 가이드
  - 방향 제어: .tooltipWrap에 'top'(기본), 'bottom', 'left', 'right' 클래스 부여
  - 강제 열림 상태: .tooltipWrap에 'isOpen' 클래스 추가 시 호버 없이도 상시 노출
  - 다중 라인: .tooltipContent에 'multiLine' 클래스 추가
-->

<!-- 1. 기본 아이콘 툴팁 (방향별: top / bottom / left / right) -->
<div style="display: flex; gap: 40px; align-items: center; flex-wrap: wrap; padding: 40px 20px;">
  <!-- Top (기본) -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>상단 툴팁</span>
    <div class="tooltipWrap top">
      <button type="button" class="tooltipBtn" aria-label="도움말">?</button>
      <div class="tooltipContent" role="tooltip">상단에 노출되는 설명 툴팁입니다.</div>
    </div>
  </div>

  <!-- Bottom -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>하단 툴팁</span>
    <div class="tooltipWrap bottom">
      <button type="button" class="tooltipBtn" aria-label="도움말">?</button>
      <div class="tooltipContent" role="tooltip">하단에 노출되는 설명 툴팁입니다.</div>
    </div>
  </div>

  <!-- Left -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>좌측 툴팁</span>
    <div class="tooltipWrap left">
      <button type="button" class="tooltipBtn" aria-label="도움말">?</button>
      <div class="tooltipContent" role="tooltip">좌측 설명 툴팁입니다.</div>
    </div>
  </div>

  <!-- Right -->
  <div style="display: flex; align-items: center; gap: 6px;">
    <span>우측 툴팁</span>
    <div class="tooltipWrap right">
      <button type="button" class="tooltipBtn" aria-label="도움말">?</button>
      <div class="tooltipContent" role="tooltip">우측 설명 툴팁입니다.</div>
    </div>
  </div>
</div>

<!-- 2. 버튼 툴팁 및 다중 라인 -->
<div style="display: flex; gap: 30px; align-items: center; flex-wrap: wrap; padding: 10px 20px;">
  <!-- 버튼 위 툴팁 -->
  <div class="tooltipWrap top">
    <button type="button" class="btn outline">마우스를 올려보세요</button>
    <div class="tooltipContent" role="tooltip">클릭 시 상세 모달이 열립니다.</div>
  </div>

  <!-- [D] 다중 라인 말풍선: multiLine 클래스 추가 -->
  <div class="tooltipWrap bottom">
    <button type="button" class="btn primary">안내 정보</button>
    <div class="tooltipContent multiLine" role="tooltip">
      최대 3줄까지 입력 가능한 긴 설명 툴팁입니다. 자동 줄바꿈이 적용됩니다.
    </div>
  </div>
</div>
