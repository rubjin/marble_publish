<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <Button />
  - 속성 인터페이스:
    * variant?: 'primary' | 'dark' | 'outline' | 'light' | 'secondary' | 'danger' | 'ghost' (기본값: 'primary')
    * size?: 'sm' | 'md' | 'lg' (기본값: 'md', sm: 24px, md: 34px, lg: 40px)
    * fullWidth?: boolean (기본값: false, full 클래스 추가)
    * disabled?: boolean (기본값: false, disabled 속성 또는 .isDisabled)
    * type?: 'button' | 'submit' | 'reset' (기본값: 'button')
    * icon?: React.ReactNode (.ico 클래스가 포함된 아이콘 요소)
    * iconPosition?: 'left' | 'right' (기본값: 'left')
    * children?: React.ReactNode
    * onClick?: (e: React.MouseEvent<HTMLButtonElement>) => void
  - 상태 클래스:
    * .isDisabled, :disabled : 비활성화 상태
    * .isActive : 활성화(선택) 상태 (.light, .secondary 등)
-->

<!-- 1. 버튼 스타일 유형 (기본 MD 사이즈: 높이 34px) -->
<!-- Case 1-1: Primary (메인 강조 액션) -->
<button type="button" class="btn primary">Primary</button>

<!-- Case 1-2: Dark (차분한 주요 액션) -->
<button type="button" class="btn dark">Dark</button>

<!-- Case 1-3: Outline (보조 액션 / 기본 버튼) -->
<button type="button" class="btn outline">Outline</button>

<!-- Case 1-4: Light (배경색 있는 보조 버튼) -->
<button type="button" class="btn light">Light</button>

<!-- Case 1-5: Danger (삭제, 취소 등 위험 액션) -->
<button type="button" class="btn danger">Danger</button>

<!-- Case 1-6: Ghost (배경/테두리 없는 텍스트형 버튼) -->
<button type="button" class="btn ghost">Ghost</button>

<!-- 2. Sizes (크기 변형) -->
<!-- Case 2-1: Small (높이 24px, 폰트 12px) -->
<button type="button" class="btn primary sm">Primary SM</button>
<button type="button" class="btn outline sm">Outline SM</button>
<button type="button" class="btn dark sm">Dark SM</button>

<!-- Case 2-2: Medium / Default (높이 34px, 폰트 14px) -->
<button type="button" class="btn primary">Primary MD</button>
<button type="button" class="btn outline">Outline MD</button>
<button type="button" class="btn dark">Dark MD</button>

<!-- Case 2-3: Large (높이 40px, 폰트 16px - 페이지 하단 액션용) -->
<button type="button" class="btn primary lg">Primary LG</button>
<button type="button" class="btn outline lg">Outline LG</button>
<button type="button" class="btn dark lg">Dark LG</button>

<!-- 3. Full Width (가로 100% 확장) -->
<button type="button" class="btn primary full">Primary Full Width (100%)</button>
<button type="button" class="btn outline full">Outline Full Width (100%)</button>

<!-- 4. States (비활성화 및 활성화 상태) -->
<!-- Case 4-1: Disabled (disabled 속성 또는 .isDisabled 클래스) -->
<button type="button" class="btn primary" disabled>Primary Disabled</button>
<button type="button" class="btn outline" disabled>Outline Disabled</button>
<button type="button" class="btn dark" disabled>Dark Disabled</button>
<button type="button" class="btn ghost isDisabled">Ghost Disabled</button>

<!-- Case 4-2: Active (토글 선택 상태) -->
<button type="button" class="btn light isActive">Light Active</button>

<!-- 5. Icon Buttons (아이콘 버튼) -->
<!-- Case 5-1: 아이콘 + 텍스트 버튼 (다운로드 / 캘린더 등) -->
<button type="button" class="btn outline">
  <span class="ico download"></span>
  <span>엑셀 다운로드</span>
</button>
<button type="button" class="btn primary">
  <span class="ico download"></span>
  <span>다운로드</span>
</button>

<!-- Case 5-2: 소형 아이콘 버튼 (SM - 높이 24px) -->
<button type="button" class="btn outline sm">
  <span class="ico sm download"></span>
  <span>다운로드</span>
</button>

<!-- Case 5-3: 아이콘 단독 버튼 -->
<button type="button" class="btn outline sm">
  <span class="ico download"></span>
</button>
