<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <SegmentedControl items={options} value={selected} onChange={setSelected} />
  - 속성 인터페이스:
    * items: Array<{ label: string; value: string | number; disabled?: boolean }>
    * value: string | number
    * onChange: (value: string | number) => void
    * size?: 'sm' | 'md' | 'lg' (기본값: 'md')
    * fullWidth?: boolean (기본값: false, full 클래스 추가)
    * disabled?: boolean
  - 상태 클래스:
    * .segmentItem.isActive : 선택된 활성 탭 버튼
    * .segmentItem.isDisabled / disabled : 비활성화
-->

<!-- Case 1: 버튼 방식 (React state 기반 클릭 제어 - 권장) -->
<div class="segment">
  <!-- [D] 선택된 항목에 .isActive 클래스 바인딩 -->
  <button type="button" class="segmentItem isActive">일별 (DAU)</button>
  <button type="button" class="segmentItem">월별 (MAU)</button>
  <button type="button" class="segmentItem">서비스 고척도</button>
</div>

<div style="width: 100%; height: 2px;"></div><!-- 구분선 -->

<!-- Case 2: 라디오 input 방식 (Form 제출 / name 그룹화 용) -->
<div class="segment">
  <!-- [D] 선택된 항목에 input checked 속성 제어 -->
  <label class="segmentItem">
    <input type="radio" name="missionState" checked />
    <span class="segmentText">일별 (DAU)</span>
  </label>
  <label class="segmentItem">
    <input type="radio" name="missionState" />
    <span class="segmentText">월별 (MAU)</span>
  </label>
  <label class="segmentItem">
    <input type="radio" name="missionState" />
    <span class="segmentText">서비스 고척도</span>
  </label>
</div>
