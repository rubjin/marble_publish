<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <IconButton /> 또는 <Button icon={<Icon name="..." />} />
  - 속성 인터페이스:
    * variant?: 'primary' | 'dark' | 'outline' | 'light' | 'danger' | 'ghost' (기본값: 'outline')
    * size?: 'sm' | 'md' | 'lg' (기본값: 'md')
    * icon: string | React.ReactNode (e.g., 'download', 'calendar' 등 .ico 클래스)
    * iconPosition?: 'left' | 'right' (기본값: 'left')
    * children?: React.ReactNode
-->

<!-- Case 1: 아이콘 + 텍스트 버튼 (다운로드 / 캘린더 등) -->
<button type="button" class="btn outline">
  <span class="ico download"></span>
  <span>엑셀 다운로드</span>
</button>

<button type="button" class="btn primary">
  <span class="ico download"></span>
  <span>다운로드</span>
</button>

<!-- Case 2: 소형 아이콘 버튼 (SM - 높이 24px) -->
<button type="button" class="btn outline sm">
  <span class="ico sm download"></span>
  <span>다운로드</span>
</button>

<!-- Case 3: 아이콘 단독 버튼 -->
<button type="button" class="btn outline sm">
  <span class="ico download"></span>
</button>
