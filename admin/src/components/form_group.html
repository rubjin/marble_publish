<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트 1: <InputGroup hasBtn={<button type="button" class="btn outline">확인</button>}> <Input ... /> </InputGroup>
  - 컴포넌트 2: <InputGroup hasUnit="원"> <Input ... /> </InputGroup>
  - 컴포넌트 3: <Select ... />
  - 컴포넌트 4: <TagBox tags={tags} onRemoveTag={...} onAddClick={...} guideText="..." />
  - 컴포넌트 5: <DateRangePicker startDate={start} endDate={end} onStartDateChange={...} onEndDateChange={...} noLimit={noLimit} onNoLimitChange={...} />
  - 컴포넌트 6: <SearchInput value={val} onSearchClick={...} guideText="..." />
  - 속성 인터페이스:
    * tags: Array<{ id: string | number; label: string }> (태그 목록)
    * onRemoveTag: (tagId: string | number) => void (태그 삭제 콜백)
    * startDate / endDate: string (시작일 / 종료일, 형식: YYYY.MM.DD)
-->

<!-- 1. 인풋 + 버튼 결합 (.hasBtn) -->
<div class="formGroup">
  <label class="formLabel">인풋 + 버튼 결합 (.hasBtn)</label>
  <div class="formControlWrap hasBtn full">
    <input type="text" class="formControl" placeholder="내용을 입력해주세요" />
    <button type="button" class="btn outline">확인</button>
  </div>
</div>

<!-- 2. 단위 결합 인풋 (.hasUnit) -->
<div class="formGroup">
  <label class="formLabel">수량 / 단위 입력 (우측 단위)</label>
  <div class="formControlWrap full hasUnit">
    <input type="text" class="formControl" placeholder="0" value="50,000" />
    <span class="inputUnit">원</span>
  </div>
</div>

<!-- 3. 셀렉트 박스 (드롭다운 + 하단 안내 문구) -->
<div class="formGroup">
  <label class="formLabel" for="idMissionType">Select Box (드롭다운 + 가이드 문구)</label>
  <div class="formControlWrap">
    <select id="idMissionType" class="formControl">
      <option value="1">옵션 A</option>
      <option value="2">옵션 B</option>
    </select>
    <span class="formGuideText">유형을 선택하고 관리합니다.</span>
  </div>
  <p class="formGuideText blue">※ 유형 선택에 따라 아래 상세 설정 화면이 변경됩니다.</p>
</div>

<!-- 4. 조회형 인풋 (인풋 + 검색 버튼 + 가이드 문구) -->
<div class="formGroup">
  <label class="formLabel" for="idMissionID">코드 조회 (조회형 폼)</label>
  <div class="formControlWrap hasBtn">
    <input type="text" id="idMissionID" class="formControl" value="TP010504" readonly />
    <button type="button" class="btn outline">찾아보기</button>
    <p class="formGuideText">미션ID를 직접 조회하여 수정할 수 있습니다.</p>
  </div>
</div>

<!-- 5. 태그 박스 (태그 선택 및 관리) -->
<div class="formGroup">
  <label class="formLabel">Tag Box (태그 선택 및 관리)</label>
  <div class="formControlWrap full col">
    <div class="tagBox">
      <span class="tagChip">태그 1 <button type="button" class="tagDelete"></button></span>
      <span class="tagChip">태그 2 <button type="button" class="tagDelete"></button></span>
      <span class="tagChip">태그 3 <button type="button" class="tagDelete"></button></span>
      <span class="tagChip">태그 4 <button type="button" class="tagDelete"></button></span>
    </div>
    <div class="formControlBottom">
      <span class="formGuideText">노출할 항목을 선택하여 지정합니다.</span>
      <button type="button" class="btn dark">항목 선택</button>
    </div>
  </div>
</div>

<!-- 6. 기간 설정 (공통 운영기간 데이트피커 + 미지정 체크박스) -->
<div class="formGroup">
  <label class="formLabel">기간 설정</label>
  <div class="formDateRange">
    <div class="formDatepicker">
      <input type="text" class="formControl" value="2026.07.01" title="시작일" />
      <button type="button" class="btnCalendar"></button>
    </div>
    <span class="dateSeparator">~</span>
    <div class="formDatepicker">
      <input type="text" class="formControl" value="2026.08.31" title="종료일" />
      <button type="button" class="btnCalendar"></button>
    </div>
    <label class="formCheck">
      <input type="checkbox" />
      <span class="checkIcon"></span>
      <span class="checkLabel">미지정</span>
    </label>
  </div>
</div>
