<!-- ==========================================================================
  조회 컨트롤 박스 (div 기반 3줄 검색 박스 + 하단 초기화/조회 버튼)
  ========================================================================== -->
<div class="searchBox">
  <!-- 1줄: 조회일자 -->
  <div class="searchRow">
    <div class="searchItem full">
      <span class="searchLabel">조회일자</span>
      <div class="searchField">
        <div class="formRow">
          <fieldset class="formDateRange">
            <legend class="srOnly">조회기간 설정</legend>
            <div class="formDatepicker">
              <input type="text" class="formControl" value="2026.07.01" title="조회 시작일" />
              <button type="button" class="btnCalendar" aria-label="달력 열기"></button>
            </div>
            <span class="dateSeparator">~</span>
            <div class="formDatepicker">
              <input type="text" class="formControl" value="2026.08.31" title="조회 종료일" />
              <button type="button" class="btnCalendar" aria-label="달력 열기"></button>
            </div>
          </fieldset>

          <div class="segment">
            <!-- [D] 선택된 항목: input checked 속성 제어 -->
            <label class="segmentItem">
              <input type="radio" name="missionState" checked>
              <span class="segmentText">오늘</span>
            </label>
            <label class="segmentItem">
              <input type="radio" name="missionState">
              <span class="segmentText">1주일</span>
            </label>
            <label class="segmentItem">
              <input type="radio" name="missionState">
              <span class="segmentText">1개월</span>
            </label>
            <label class="segmentItem">
              <input type="radio" name="missionState">
              <span class="segmentText">3개월</span>
            </label>
            <label class="segmentItem">
              <input type="radio" name="missionState">
              <span class="segmentText">전체</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2줄: 유형 및 상태 -->
  <div class="searchRow">
    <div class="searchItem">
      <label class="searchLabel" for="searchType">유형</label>
      <div class="searchField">
        <select id="searchType" class="formControl">
          <option value="">전체</option>
          <option value="1">OX퀴즈</option>
          <option value="2">출석체크</option>
          <option value="3">설문조사</option>
          <option value="4">챌린지</option>
        </select>
      </div>
    </div>

    <div class="searchItem">
      <span class="searchLabel">상태</span>
      <div class="searchField">
        <fieldset class="formCheckGroup">
          <legend class="srOnly">상태 선택</legend>
          <label class="formCheck">
            <input type="radio" name="searchStatus" checked />
            <span class="checkIcon"></span>
            <span class="checkLabel">전체</span>
          </label>
          <label class="formCheck">
            <input type="radio" name="searchStatus" />
            <span class="checkIcon"></span>
            <span class="checkLabel">운영중</span>
          </label>
          <label class="formCheck">
            <input type="radio" name="searchStatus" />
            <span class="checkIcon"></span>
            <span class="checkLabel">일시중단</span>
          </label>
          <label class="formCheck">
            <input type="radio" name="searchStatus" />
            <span class="checkIcon"></span>
            <span class="checkLabel">종료</span>
          </label>
        </fieldset>
      </div>
    </div>
  </div>

  <!-- 3줄: 검색어 -->
  <div class="searchRow">
    <div class="searchItem full">
      <label class="searchLabel" for="searchKeyword">검색어</label>
      <div class="searchField">
        <div class="formRow">
          <select class="formControl">
            <option value="all">전체</option>
            <option value="title">미션명</option>
            <option value="id">미션ID</option>
            <option value="author">등록자</option>
          </select>
          <div class="formControlWrap">
            <input type="text" id="searchKeyword" class="formControl full" placeholder="검색어를 입력해주세요" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 박스 하단 초기화 / 조회 버튼 -->
  <div class="searchBtnArea">
    <button type="button" class="btn outline">초기화</button>
    <button type="button" class="btn dark">조회</button>
  </div>
</div>
