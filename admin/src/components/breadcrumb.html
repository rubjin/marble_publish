<!-- 
  [React Component Guide]
  - Component: <Breadcrumb items={[{ label: '홈', href: '/' }, { label: '뎁스2', href: '/depth2' }, { label: '현재페이지' }]} />
  - Props Interface:
    * items: Array<{ label: string; href?: string; isCurrent?: boolean }>
    * separator?: React.ReactNode (기본 구분자 화살표 아이콘)
    * className?: string
  - State Classes:
    * .breadcrumbItem.isCurrent : 현재 페이지 항목 (링크 대신 텍스트로 렌더링)
-->

<!-- Breadcrumb (Default) -->
<nav class="breadcrumb">
  <ol class="breadcrumbList">
    <li class="breadcrumbItem">
      <a href="#" class="breadcrumbLink">홈</a>
    </li>
    <li class="breadcrumbItem">
      <a href="#" class="breadcrumbLink">뎁스2</a>
    </li>
    <li class="breadcrumbItem isCurrent">
      현재페이지
    </li>
  </ol>
</nav>
