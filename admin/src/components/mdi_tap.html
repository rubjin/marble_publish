<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <MdiTabBar tabs={openTabs} activeTabId={currentId} onSelectTab={...} onCloseTab={...} onCloseAll={...} />
  - 속성 인터페이스:
    * tabs: Array<{ id: string; title: string; closable?: boolean }>
    * activeTabId: string (현재 활성화된 탭 ID)
    * onSelectTab: (tabId: string) => void (탭 클릭 시 화면 전환)
    * onCloseTab: (tabId: string) => void (개별 탭 닫기)
    * onCloseAll: () => void (우측 전체 닫기)
    * onHomeClick?: () => void (홈 탭 클릭 시 대시보드 이동)
  - 상태 클래스:
    * .mdiTabItem.isHome : 좌측 홈 고정 탭
    * .mdiTabItem.isActive : 현재 보고 있는 활성 탭
-->

<!-- ==========================================================================
  MDI 탭 바 (MDI Tab Bar: 좌측 홈 고정 노출 / 최대 7개 탭 / 우측 전체닫기 아이콘)
  ========================================================================== -->
<div class="mdiTabWrap">
  <!-- 좌측 홈 화면 탭 (항상 고정 노출, 닫기 버튼 없음) -->
  <button type="button" class="mdiTabItem isHome" title="홈 화면">
    <span class="tabIcon">
      <span class="ico mdiTabHome"></span>
    </span>
  </button>

  <ul class="mdiTabList">
    <!-- Case 1: 활성화 탭 (isActive) -->
    <li>
      <div class="mdiTabItem isActive">
        <span class="tabText">미션등록</span>
        <button type="button" class="tabClose">
          <span class="ico sm mdiTabClose"></span>
        </button>
      </div>
    </li>

    <!-- Case 2: 일반 열린 탭 -->
    <li>
      <div class="mdiTabItem">
        <span class="tabText">미션관리</span>
        <button type="button" class="tabClose">
          <span class="ico sm mdiTabClose"></span>
        </button>
      </div>
    </li>

    <li>
      <div class="mdiTabItem">
        <span class="tabText">챌린지 운영 현황</span>
        <button type="button" class="tabClose">
          <span class="ico sm mdiTabClose"></span>
        </button>
      </div>
    </li>

    <li>
      <div class="mdiTabItem">
        <span class="tabText">회원 및 권한관리</span>
        <button type="button" class="tabClose">
          <span class="ico sm mdiTabClose"></span>
        </button>
      </div>
    </li>

    <li>
      <div class="mdiTabItem">
        <span class="tabText">포인트/리워드 관리</span>
        <button type="button" class="tabClose">
          <span class="ico sm mdiTabClose"></span>
        </button>
      </div>
    </li>

    <li>
      <div class="mdiTabItem">
        <span class="tabText">통계 및 성과 분석</span>
        <button type="button" class="tabClose">
          <span class="ico sm mdiTabClose"></span>
        </button>
      </div>
    </li>

    <li>
      <div class="mdiTabItem">
        <span class="tabText">공통 시스템 설정</span>
        <button type="button" class="tabClose">
          <span class="ico sm mdiTabClose"></span>
        </button>
      </div>
    </li>
  </ul>

  <!-- 우측 전체 닫기 버튼 -->
  <div class="mdiTabActions">
    <button type="button" class="btnAllClose" title="전체 탭 닫기">
      <span class="ico sm mdiTabClose"></span>
    </button>
  </div>
</div>
