<!-- ==========================================================================
  MDI 탭 바 (MDI Tab Bar: 좌측 홈 고정 노출 / 최대 7개 탭 / 우측 전체닫기 아이콘)
  ========================================================================== -->
<div class="mdiTabWrap">
  <!-- 좌측 홈 화면 탭 (항상 고정 노출, 닫기 버튼 없음) -->
  <button type="button" class="mdiTabItem isHome" title="홈 화면">
    <span class="tabIcon">
      <span class="ico mdiTabHome"></span>
    </span>
  </button>

  <ul class="mdiTabList">
    <!-- 활성화 탭: isActive -->
    <li>
      <div class="mdiTabItem isActive">
        <span class="tabText">미션등록</span>
        <button type="button" class="tabClose" aria-label="미션등록 탭 닫기"><span class="ico sm mdiTabClose"></span></button>
      </div>
    </li>

    <!-- 페이지 탭 2 -->
    <li>
      <div class="mdiTabItem">
        <span class="tabText">미션관리</span>
        <button type="button" class="tabClose" aria-label="미션관리 탭 닫기"><span class="ico sm mdiTabClose"></span></button>
      </div>
    </li>

    <!-- 페이지 탭 3 -->
    <li>
      <div class="mdiTabItem">
        <span class="tabText">챌린지 운영 현황</span>
        <button type="button" class="tabClose" aria-label="챌린지 운영 현황 탭 닫기"><span class="ico sm mdiTabClose"></span></button>
      </div>
    </li>

    <!-- 페이지 탭 4 -->
    <li>
      <div class="mdiTabItem">
        <span class="tabText">회원 및 계좌조회</span>
        <button type="button" class="tabClose" aria-label="회원 및 계좌조회 탭 닫기"><span class="ico sm mdiTabClose"></span></button>
      </div>
    </li>

    <!-- 페이지 탭 5 -->
    <li>
      <div class="mdiTabItem">
        <span class="tabText">포인트/리워드 관리</span>
        <button type="button" class="tabClose" aria-label="포인트/리워드 관리 탭 닫기"><span class="ico sm mdiTabClose"></span></button>
      </div>
    </li>

    <!-- 페이지 탭 6 -->
    <li>
      <div class="mdiTabItem">
        <span class="tabText">통계 및 성과 분석</span>
        <button type="button" class="tabClose" aria-label="통계 및 성과 분석 탭 닫기"><span class="ico sm mdiTabClose"></span></button>
      </div>
    </li>

    <!-- 페이지 탭 7 -->
    <li>
      <div class="mdiTabItem">
        <span class="tabText">공통 시스템 설정</span>
        <button type="button" class="tabClose" aria-label="공통 시스템 설정 탭 닫기"><span class="ico sm mdiTabClose"></span></button>
      </div>
    </li>
  </ul>

  <!-- 우측 전체 닫기 버튼 -->
  <div class="mdiTabActions">
    <button type="button" class="btnAllClose" title="전체 탭 닫기" aria-label="전체 탭 닫기">
      <span class="ico sm mdiTabClose"></span>
    </button>
  </div>
</div>
