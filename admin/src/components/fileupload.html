<!-- 
  [리액트 컴포넌트 가이드]
  - 라이브러리: react-dropzone (useDropzone)
      getRootProps({ className: cx('fileDropzone', { isDragOver: isDragActive }) }) → .fileDropzone
      getInputProps() → .dropzoneHeader 내부 input / open() → [파일 선택] 버튼
      useDropzone({ multiple: false, maxFiles: 1 }) - 드래그앤드롭 첨부는 단일 파일만 허용 (다중 첨부 없음)
      onDrop(accepted, rejected) : rejected 는 .formErrorMsg 로 안내 (형식 / 용량)
  - 컴포넌트 1: <FileDropzone files={fileList} onDrop={handleDrop} onSelect={handleSelect} onRemove={handleRemove} accept="image/*" maxSize={5MB} />
  - 컴포넌트 2: <StepCard stepNumber={1} title="코스명" onCopy={...} onDelete={...}> ... </StepCard>
  - 속성 인터페이스 (<FileDropzone />):
    * files: Array<{ id: string | number; name: string; size: number; url?: string }>
        - size : byte 단위 숫자, 화면에서 1.5MB / 300KB 형태로 변환해 .fileSize 에 표시
        - url  : 다운로드 / 미리보기 주소 (.fileName href, 없으면 링크 동작 없음)
    * onDrop: (files: File[]) => void
    * onRemove: (fileId: string | number) => void
    * accept?: string (e.g., 'image/png, image/jpeg')
    * guideText?: string
  - 상태 클래스:
    * .fileDropzone.isDragOver : 드래그앤드롭 진입 시 테두리/배경 활성화
    * 단일 첨부(드롭존형) : 첨부 전 .fileDropzone 만 노출 / 첨부 후 드롭존 숨김 + .fileList 노출
                          (input 은 드롭존 밖에 두어 첨부 후에도 [파일 선택] 버튼으로 교체 가능)
    * .stepCard.isDragging : 순서 변경 중인 원본 카드 (점선 빈 자리)
    * .stepCard.isOverlay  : 커서를 따라다니는 미리보기 카드 (예: dnd-kit <DragOverlay>) - 스타일: dnd.scss
-->

<!-- STEP 카드 리스트 (드래그 핸들 + 단계별 입력 폼 + 파일첨부) -->
<div class="stepCardList">
  <!-- 상단 이미지 첨부 전 -->
  <div class="stepCard">
    <div class="stepHeader">
      <div class="stepTitleWrap">
        <span class="ico lg stepHandle"></span>
        <h4 class="stepTitle">STEP 1. 정상 미션</h4>
      </div>
      <div class="stepActions">
        <button type="button" class="btn outline sm">복사</button>
        <button type="button" class="btn danger sm">삭제</button>
      </div>
    </div>
    <table class="tbl">
      <colgroup>
        <col style="width: 100px;" />
        <col />
      </colgroup>
      <tbody>
        <tr>
          <th><label class="formLabel">코스명 <span class="required">*</span></label></th>
          <td><input type="text" class="formControl full" value="정상 도달" /></td>
        </tr>
        <tr>
          <th><label class="formLabel">수행조건 <span class="required">*</span></label></th>
          <td><input type="text" class="formControl full" value="해당기간 100만원 이상 주문하기" /></td>
        </tr>
        <tr>
          <th><label class="formLabel">보조 문구</label></th>
          <td><input type="text" class="formControl full" value="자산 성장 성공" /></td>
        </tr>
        <tr>
          <th><span class="formLabel">상단 이미지</span></th>
          <td>
            <div class="formControlWrap full col">
              <!-- [D] 첨부 전: 드롭존 노출 (드래그 시 .fileDropzone.isDragOver) -->
              <div class="fileDropzone">
                <div class="dropzoneHeader">
                  <input type="file" accept=".jpg,.jpeg,.png" />
                  <span class="ico xl upload"></span>
                  <p class="dropzoneText">파일 선택 또는 이미지를 끌어다 놓으세요.</p>
                </div>
              </div>
              <div class="formControlBottom">
                <span class="formGuideText">해당 STEP이 진행 단계일때 상단에 노출되는 이미지입니다. (JPG, PNG / 최대 5MB)</span>
                <button type="button" class="btn outline">파일 선택</button>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 상단 이미지 첨부 후 -->
  <div class="stepCard">
    <div class="stepHeader">
      <div class="stepTitleWrap">
        <span class="ico lg stepHandle"></span>
        <h4 class="stepTitle">STEP 2. 입산 미션</h4>
      </div>
      <div class="stepActions">
        <button type="button" class="btn outline sm">복사</button>
        <button type="button" class="btn danger sm">삭제</button>
      </div>
    </div>
    <table class="tbl">
      <colgroup>
        <col style="width: 100px;" />
        <col />
      </colgroup>
      <tbody>
        <tr>
          <th><label class="formLabel">코스명 <span class="required">*</span></label></th>
          <td><input type="text" class="formControl full" value="정상 도달" /></td>
        </tr>
        <tr>
          <th><label class="formLabel">수행조건 <span class="required">*</span></label></th>
          <td><input type="text" class="formControl full" value="해당기간 100만원 이상 주문하기" /></td>
        </tr>
        <tr>
          <th><label class="formLabel">보조 문구</label></th>
          <td><input type="text" class="formControl full" value="자산 성장 성공" /></td>
        </tr>
        <tr>
          <th><span class="formLabel">상단 이미지</span></th>
          <td>
            <div class="formControlWrap full col">
              <!-- [D] 첨부 후: 드롭존 숨김 + 파일 목록 노출 (교체는 [파일 선택], 삭제 시 다시 드롭존 노출) -->
              <ul class="fileList">
                <li class="fileItem">
                  <div class="fileInfo">
                    <a class="fileName" href="#;">투자사랑 산악회 챌린지 시작전 메인 소개 이미지.jpg<span class="fileSize">(1542byte)</span></a>
                  </div>
                  <button type="button" class="fileDelete" aria-label="삭제">
                    <span class="ico deleteTag"></span>
                  </button>
                </li>
              </ul>
              <div class="formControlBottom">
                <span class="formGuideText">해당 STEP이 진행 단계일때 상단에 노출되는 이미지입니다. (JPG, PNG / 최대 5MB)</span>
                <button type="button" class="btn outline">파일 선택</button>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
