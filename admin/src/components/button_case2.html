<!-- 
  [React Component Guide]
  - Component: <ButtonGroup size="sm" | "md" | "lg" />
  - Props Interface:
    * size?: 'sm' | 'md' | 'lg' (default: 'md')
    * align?: 'left' | 'right' | 'center' (align: 'right' 시 .btnGroupRight 적용)
    * children?: React.ReactNode
  - Description:
    * 그리드 내부, 행 단위 제어, 모달 내 제어 등 다양한 위치에서 인라인으로 활용되는 버튼 그룹입니다.
-->

<!-- Case 1: 소형 버튼 그룹 (테이블 행/카드 액션용, 높이 24px) -->
<div class="btnGroup sm">
  <button type="button" class="btn outline">복사</button>
  <button type="button" class="btn danger">삭제</button>
</div>

<div style="width: 100%; height: 2px;"></div><!-- 구분선 -->

<!-- Case 2: 인라인 보조 버튼 (Outline) -->
<button type="button" class="btn outline">찾아보기</button>
<button type="button" class="btn outline">연결 해제</button>

<div style="width: 100%; height: 2px;"></div><!-- 구분선 -->

<!-- Case 3: 폼/모달 내부 주요 액션 버튼 (Dark) -->
<button type="button" class="btn dark">화면선택</button>
<button type="button" class="btn dark">파일선택</button>
<button type="button" class="btn dark">메모 등록</button>
<button type="button" class="btn dark">모바일 미리보기</button>
<button type="button" class="btn dark">+ 단계 추가하기</button>
<button type="button" class="btn dark">리워드 선택</button>

<div style="width: 100%; height: 2px;"></div><!-- 구분선 -->

<!-- Case 4: 폼 인라인 보조 버튼 (Light) -->
<button type="button" class="btn light">파일 선택</button>
<button type="button" class="btn light">메모 등록</button>
