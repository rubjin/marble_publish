<!-- Default Modal Popup -->
<div id="popupBasic" class="popupDimmed">
  <div class="popupWrap">
    <div class="popupHeader">
      <h2 class="popupTitle">팝업 타이틀 (기본)</h2>
      <button type="button" class="btnClose" aria-label="닫기" onclick="this.closest('.popupDimmed').classList.remove('isOpen')"></button>
    </div>
    <div class="popupBody">
      <p>기본 사이즈 팝업 컨텐츠 영역입니다.</p>
      <p>여기에 텍스트나 폼 요소 등 다양한 내용을 넣을 수 있습니다.</p>
    </div>
    <div class="popupFooter">
      <button type="button" class="btn outline" onclick="this.closest('.popupDimmed').classList.remove('isOpen')">취소</button>
      <button type="button" class="btn primary" onclick="this.closest('.popupDimmed').classList.remove('isOpen')">확인</button>
    </div>
  </div>
</div>

<!-- Large Modal Popup -->
<div id="popupLarge" class="popupDimmed">
  <div class="popupWrap lg">
    <div class="popupHeader">
      <h2 class="popupTitle">팝업 타이틀 (Large)</h2>
      <button type="button" class="btnClose" aria-label="닫기" onclick="this.closest('.popupDimmed').classList.remove('isOpen')"></button>
    </div>
    <div class="popupBody">
      <p>가로 너비가 넓은(lg) 팝업입니다. 복잡한 표나 폼이 들어갈 때 사용합니다.</p>
    </div>
    <div class="popupFooter">
      <button type="button" class="btn primary" onclick="this.closest('.popupDimmed').classList.remove('isOpen')">확인</button>
    </div>
  </div>
</div>
