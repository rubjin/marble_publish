<!-- 
  [React Component Guide]
  - Component: <Modal isOpen={isOpen} onClose={handleClose} title="..." size="md" footer={...}> ... </Modal>
  - Props Interface:
    * isOpen: boolean (controlled visibility)
    * onClose: () => void (X 버튼, 취소 버튼, Dimmed 클릭 시 호출)
    * title: string | React.ReactNode (팝업 헤더 타이틀)
    * size?: 'md' | 'lg' (default: 'md', 'lg'는 .popupWrap.lg)
    * children: React.ReactNode (팝업 본문 .popupBody)
    * footer?: React.ReactNode (팝업 하단 버튼 영역 .popupFooter)
    * closeOnDimmedClick?: boolean (default: true)
  - State Classes:
    * .popupDimmed.isOpen : 팝업 열림(화면 표시)
-->

<!-- Case 1: 기본 모달 팝업 (Default MD Size) -->
<!-- [D] 열림 상태: .popupDimmed 에 .isOpen 클래스 추가 -->
<div id="popupBasic" class="popupDimmed isOpen" role="dialog" aria-modal="true" aria-labelledby="popupBasicTitle">
  <div class="popupWrap">
    <div class="popupHeader">
      <h2 id="popupBasicTitle" class="popupTitle">팝업 타이틀 (기본)</h2>
      <button type="button" class="btnClose" aria-label="닫기"></button>
    </div>
    <div class="popupBody">
      <p>기본 사이즈 팝업 컨텐츠 영역입니다.</p>
      <p>여기에 텍스트나 폼 요소 등 다양한 내용을 넣을 수 있습니다.</p>
    </div>
    <div class="popupFooter">
      <button type="button" class="btn outline">취소</button>
      <button type="button" class="btn primary">확인</button>
    </div>
  </div>
</div>

<div style="width: 100%; height: 20px;"></div>

<!-- Case 2: 대형 모달 팝업 (Large Size - .popupWrap.lg) -->
<div id="popupLarge" class="popupDimmed" role="dialog" aria-modal="true" aria-labelledby="popupLargeTitle">
  <div class="popupWrap lg">
    <div class="popupHeader">
      <h2 id="popupLargeTitle" class="popupTitle">팝업 타이틀 (Large)</h2>
      <button type="button" class="btnClose" aria-label="닫기"></button>
    </div>
    <div class="popupBody">
      <p>가로 너비가 넓은(lg) 팝업입니다. 복잡한 표나 폼이 들어갈 때 사용합니다.</p>
    </div>
    <div class="popupFooter">
      <button type="button" class="btn outline">취소</button>
      <button type="button" class="btn primary">확인</button>
    </div>
  </div>
</div>
