<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <Toast message="..." type="default" onClose={...} /> 또는 toast.success("...")
  - 속성 인터페이스:
    * message: string | React.ReactNode (노출할 텍스트)
    * type?: 'default' | 'success' | 'warning' | 'error' (기본값: 'default')
    * duration?: number (자동 닫힘 ms, 기본값: 3000)
    * onClose?: () => void (닫기 버튼 클릭 또는 시간 만료 시 호출)
    * position?: 'topCenter' | 'bottomCenter' | 'bottomRight' (기본값: 'bottomRight')
  - 컨테이너: <div class="toastContainer [topCenter | bottomCenter]"> ... </div>
-->

<!-- 1. 기본 다크 토스트 -->
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 480px;">
  <div class="toast">
    <span class="toastIcon">
      <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.244.304l-.459 2.066A1.75 1.75 0 0010.747 15H11a.75.75 0 000-1.5h-.253a.25.25 0 01-.244-.304l.459-2.066A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd"/></svg>
    </span>
    <span class="toastMessage">설정이 성공적으로 저장되었습니다.</span>
    <button type="button" class="toastClose">
      <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
    </button>
  </div>
</div>
