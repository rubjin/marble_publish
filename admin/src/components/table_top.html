<!-- 기본형 (좌측: 타이틀 & 건수 / 우측: 버튼 그룹) -->
<div class="tblTop">
  <div class="tblLeft">
    <h3 class="tblTitle">챌린지 운영 현황</h3>
    <span class="tblCount">총<strong class="count">6</strong>건<span class="tblUnit">(단위 : 원)</span></span>
    <select class="formControl">
      <option value="10">10건씩 보기</option>
      <option value="20">20건씩 보기</option>
      <option value="50">50건씩 보기</option>
    </select>
  </div>
  <div class="tblRight">
    <div class="btnGroup">
      <button type="button" class="btn outline">챌린지 추가</button>
      <button type="button" class="btn outline">
        <span class="ico download"></span>
        <span>엑셀 다운로드</span>
      </button>
    </div>
  </div>
</div>


<!-- 좌측 타이틀 (단위 : 원) + 우측 가이드문구 -->
<div class="tblTop">
  <div class="tblLeft">
    <h3 class="tblTitle">미션별 한도설정</h3>
    <span class="tblUnit">(단위 : 원)</span>
  </div>
  <div class="tblRight">
    <p class="tblGuide">※ 미션별 한도 합계가 전체 예산을 초과 할 수 없습니다.</p>
  </div>
</div>
