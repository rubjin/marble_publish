<!-- 
  [리액트 컴포넌트 가이드]
  - 컴포넌트: <Tabs items={tabList} activeKey={activeKey} onChange={setActiveKey} />
  - 속성 인터페이스:
    * items: Array<{ key: string | number; label: string; disabled?: boolean }>
    * activeKey: string | number (활성화된 탭 키)
    * onChange: (key: string | number) => void
    * className?: string
  - 상태 클래스:
    * .item.isActive : 선택된 활성 탭 (다크 배경 / 하이라이트 표시)
    * .item:disabled, .item.isDisabled : 비활성 탭 (비활성화 배경 및 텍스트)
-->

<nav class="tab">
  <!-- [D] 활성 탭: .item.isActive 클래스 바인딩 -->
  <button type="button" class="item isActive">활성화 탭 (Active)</button>
  <button type="button" class="item">디폴트 탭 (Default)</button>
  <button type="button" class="item">세 번째 탭</button>
  <button type="button" class="item" disabled>비활성 탭 (Disabled)</button>
</nav>
