<!--
  [리액트 컴포넌트 가이드 - react-day-picker v9 / v10]
  - 라이브러리 기본 클래스(.rdp-*)를 그대로 사용하므로 classNames 커스터마이징이 필요 없습니다.
  - 스타일: styles/scss/components/calendar.scss ('react-day-picker/style.css' import 불필요)
  - 권장 공통 옵션
      import { DayPicker } from 'react-day-picker';
      import { ko } from 'react-day-picker/locale';

      <DayPicker
        locale={ko}
        weekStartsOn={0}          // 일요일 시작 (주말 색상 기준)
        navLayout="around"        // [<] 2026년 9월 [>]
        showOutsideDays           // 단일 선택 시 권장 (기간 2개월 표시 시 false)
        formatters={{ formatCaption: (d) => format(d, 'yyyy년 M월') }}
      />

  - 입력창 + 레이어 구조
    <div class="formDatepicker [isOpen]">          // 열림 상태: .isOpen
      <input class="formControl" readOnly />
      <button class="btnCalendar" />
      <div class="datePickerLayer [alignRight | alignTop]">
        <div class="datePickerBody">
          <div class="datePickerMain"><DayPicker ... /></div>
          <div class="datePickerFooter">...</div>   // 선택값 요약 + 취소/적용
        </div>
      </div>
    </div>

  - 기간 선택 : <div class="formDateRange isOpen"> + .datePickerPreset(빠른 선택) + numberOfMonths={2}
  - 선택 불가 : disabled={{ after: new Date() }} → .rdp-disabled
-->
