<!-- 
  [React Component Guide]
  - Component 1: <InlineList items={...} /> (.listBar)
  - Component 2: <VerticalList items={...} /> (.listBarVertical)
  - Props Interface:
    * items: Array<string | { label: string; value: string; href?: string; isPoint?: boolean }>
    * size?: 'sm' | 'md' | 'lg' (default: 'md')
    * className?: string
-->

<!-- ==========================================================================
  1. 가로형 세로 바 리스트 (Inline Bar List: .listBar)
  ========================================================================== -->

<!-- Case 1-1: 가로형 바 리스트 (기본 텍스트) -->
<ul class="listBar">
  <li class="listBarItem">Default (15px - 기본)</li>
  <li class="listBarItem">사이즈 Default</li>
  <li class="listBarItem">사이즈 Default</li>
</ul>

<!-- Case 1-2: 가로형 바 리스트 (링크 형태) -->
<ul class="listBar">
  <li class="listBarItem"><a href="#" class="listBarLink">링크 1</a></li>
  <li class="listBarItem"><a href="#" class="listBarLink">링크 2</a></li>
  <li class="listBarItem"><a href="#" class="listBarLink">링크 3</a></li>
  <li class="listBarItem"><a href="#" class="listBarLink">링크 4</a></li>
</ul>

<!-- Case 1-3: 가로형 바 리스트 (레이블 : 내용 정보) -->
<ul class="listBar">
  <li class="listBarItem"><span class="label">등록일</span><span class="value">2026.06.15</span></li>
  <li class="listBarItem"><span class="label">작성자</span><span class="value">관리자</span></li>
  <li class="listBarItem"><span class="label">상태</span><span class="value">운영중</span></li>
</ul>

<!-- ==========================================================================
  2. 세로형 세로 바 리스트 (Vertical Bar List: .listBarVertical)
  ========================================================================== -->

<!-- Case 2-1: 세로형 바 리스트 (기본 & 포인트 강조) -->
<ul class="listBarVertical">
  <li class="listBarItem">일반 리스트 항목</li>
  <li class="listBarItem isPoint">포인트 강조 리스트 항목 (.isPoint)</li>
</ul>

<!-- Case 2-2: 세로형 바 리스트 (타이틀 + 설명 조합) -->
<ul class="listBarVertical">
  <li class="listBarItem">
    <strong class="title">안내사항</strong>
    <span class="desc">정산 완료 후에는 취소가 불가합니다.</span>
  </li>
  <li class="listBarItem isPoint">
    <strong class="title">주의사항</strong>
    <span class="desc">관리자 승인 시 즉시 지급 처리됩니다.</span>
  </li>
</ul>
