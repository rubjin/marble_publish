<!--
  [리액트 컴포넌트 가이드 - Drag & Drop (테이블 행 순서 변경)]
  - 라이브러리와 무관하게 "상태 클래스"만 바인딩하면 되도록 설계했습니다.
    위치 이동(transform / transition)은 라이브러리가 주는 인라인 style 을 그대로 사용합니다.
  - 스타일: styles/scss/components/dnd.scss

  - 구조
    .tbl > colgroup > col.colDrag / th.colDrag / td.colDrag > button.dndHandle

  - 상태 클래스
    tr.isOverlay     : 이동 중인 행 (행 자체가 transform 으로 이동)
    tr.isDragging    : 원본 자리를 따로 남기는 라이브러리(인디케이터 방식)용
    body.isDndActive : 드래그 진행 중 (전역 커서 grabbing, 텍스트 선택 방지)

  - 예시 (dnd-kit 기준)
    // 센서: useSensor(PointerSensor, { activationConstraint: { distance: 5 } }) - 5px 이동 후 드래그 시작 (클릭과 구분)
    const { setNodeRef, setActivatorNodeRef, attributes, listeners, transform, transition, isDragging } = useSortable({ id });
    <tr ref={setNodeRef} className={cx({ isOverlay: isDragging })}
        style={{ transform: CSS.Translate.toString(transform), transition, position: 'relative', zIndex: isDragging ? 1 : undefined }}>
      <td className="colDrag">
        <button type="button" className="dndHandle" aria-label="순서 변경" ref={setActivatorNodeRef} {...attributes} {...listeners} />
      </td>
      ...
    </tr>
    // 표 밖에 미리보기를 띄우면 컬럼 너비가 맞지 않으므로 DragOverlay 는 쓰지 않습니다.
-->

<!-- 테이블 행 순서 변경 -->
<h3 class="guideSubtitle">테이블 행 순서 변경</h3>
<div class="tblWrap">
  <table class="tbl">
    <colgroup>
      <col class="colDrag" />
      <col style="width: 80px;" />
      <col />
      <col style="width: 140px;" />
    </colgroup>
    <thead>
      <tr>
        <th class="colDrag"><span class="srOnly">순서 변경</span></th>
        <th>순서</th>
        <th>카테고리명</th>
        <th>노출 여부</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="colDrag"><button type="button" class="dndHandle" aria-label="순서 변경"></button></td>
        <td>1</td>
        <td class="textLeft">리스트1</td>
        <td>노출</td>
      </tr>
      <!-- [D] 이동 중인 행: tr.isOverlay (행 자체가 transform 으로 이동, 별도 미리보기 없음) -->
      <tr class="isOverlay">
        <td class="colDrag"><button type="button" class="dndHandle" aria-label="순서 변경"></button></td>
        <td>2</td>
        <td class="textLeft">리스트2</td>
        <td>노출</td>
      </tr>
      <tr>
        <td class="colDrag"><button type="button" class="dndHandle" aria-label="순서 변경"></button></td>
        <td>3</td>
        <td class="textLeft">리스트3</td>
        <td>미노출</td>
      </tr>
    </tbody>
  </table>
</div>
