<!--
  [리액트 컴포넌트 가이드 - Drag & Drop (라이브러리 미정)]
  - 라이브러리와 무관하게 "상태 클래스"만 바인딩하면 되도록 설계했습니다.
    위치 이동(transform / transition)은 라이브러리가 주는 인라인 style 을 그대로 사용합니다.
  - 스타일: styles/scss/components/dnd.scss

  - 상태 클래스
    .isDragging      : 드래그 중인 원본 아이템 (빈 자리 표시)
    .isOverlay       : 커서를 따라다니는 미리보기 (예: dnd-kit <DragOverlay>)
    .isOver          : 드롭 영역(.dndColumn / .dndDropzone) 위에 올라온 상태
    .isDropBefore / .isDropAfter : 삽입 위치 표시선 (인디케이터 방식 라이브러리용)
    .isDisabled      : 드래그 불가
    body.isDndActive : 드래그 진행 중 (전역 커서 grabbing, 텍스트 선택 방지)

  - 예시 (dnd-kit 기준)
    // 센서: useSensor(PointerSensor, { activationConstraint: { distance: 5 } }) - 5px 이동 후 드래그 시작 (클릭과 구분)
    const { setNodeRef, setActivatorNodeRef, attributes, listeners, transform, transition, isDragging } = useSortable({ id });
    <li ref={setNodeRef} style={{ transform: CSS.Transform.toString(transform), transition }}
        className={cx('dndItem', { isDragging })}>
      <button type="button" className="dndHandle" aria-label="순서 변경" ref={setActivatorNodeRef} {...attributes} {...listeners} />
      ...
    </li>
    <DragOverlay>{activeItem && <div className="dndItem isOverlay">...</div>}</DragOverlay>

  - 테이블 행 : 표 밖에 미리보기를 띄우면 컬럼 너비가 맞지 않으므로 DragOverlay 를 쓰지 않고
                이동 중인 행 자체에 .isOverlay + style={{ transform: CSS.Translate.toString(transform), transition, position: 'relative', zIndex: 1 }}
-->

<!-- 보드 (영역 간 이동) -->
<h3 class="guideSubtitle">보드 (영역 간 이동)</h3>
<div class="dndBoard">
  <section class="dndColumn">
    <div class="dndColumnHeader">
      <h4 class="dndColumnTitle">대기</h4>
      <span class="dndCount">2</span>
    </div>
    <ul class="dndList">
      <li class="dndItem isHandle">
        <div class="dndContent">
          <strong class="dndTitle">추석 맞이 이벤트</strong>
          <span class="dndDesc">담당: 운영팀</span>
        </div>
      </li>
      <li class="dndItem isHandle isDragging">
        <div class="dndContent">
          <strong class="dndTitle">신규 가입 웰컴 미션</strong>
          <span class="dndDesc">담당: 기획팀</span>
        </div>
      </li>
    </ul>
  </section>

  <!-- [D] 드롭 대상 영역 위: .isOver -->
  <section class="dndColumn isOver">
    <div class="dndColumnHeader">
      <h4 class="dndColumnTitle">검수중</h4>
      <span class="dndCount">1</span>
    </div>
    <ul class="dndList">
      <li class="dndItem isHandle">
        <div class="dndContent">
          <strong class="dndTitle">연말 적금 챌린지</strong>
          <span class="dndDesc">담당: 상품팀</span>
        </div>
      </li>
    </ul>
  </section>

  <section class="dndColumn">
    <div class="dndColumnHeader">
      <h4 class="dndColumnTitle">완료</h4>
      <span class="dndCount">0</span>
    </div>
    <div class="dndDropzone">여기로 끌어다 놓으세요</div>
  </section>
</div>
