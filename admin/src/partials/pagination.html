<!--
  [UI 컴포넌트] 그리드/테이블 하단 페이지네이션
  <include src="../../partials/pagination.html"></include>
-->
<div class="dataGridBottom">
  <nav class="pagination" aria-label="페이지 이동">
    <button type="button" class="pageBtn first" aria-label="첫 페이지" disabled></button>
    <button type="button" class="pageBtn prev" aria-label="이전 페이지" disabled></button>
    <span class="pageNumList">
      <button type="button" class="pageNum isActive" aria-current="page">1</button>
      <button type="button" class="pageNum">2</button>
      <button type="button" class="pageNum">3</button>
      <button type="button" class="pageNum">4</button>
      <button type="button" class="pageNum">5</button>
      <span class="pageEllipsis" aria-hidden="true">...</span>
      <button type="button" class="pageNum">13</button>
    </span>
    <button type="button" class="pageBtn next" aria-label="다음 페이지"></button>
    <button type="button" class="pageBtn last" aria-label="마지막 페이지"></button>
  </nav>
</div>
