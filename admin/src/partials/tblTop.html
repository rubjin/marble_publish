<!--
  [UI 컴포넌트] 테이블 상단 (좌측: 타이틀 / 건수 / 단위 / 페이지 크기 · 우측: 가이드 문구 / 버튼)
  <include src="../../partials/tblTop.html" title="검색 결과" count="128" pageSize>
    <button type="button" class="btn primary">신규 등록</button>
  </include>
  - title    : 테이블 타이틀 - 생략 시 타이틀 미출력 (좌측 여백 없음)
  - count    : 총 건수 - 있으면 "총 N건" 출력 (0건이 아니면 건수 블루 강조)
  - unit     : 단위 문구 (예: 단위 : 원) - 있으면 출력
  - pageSize : 페이지 크기 셀렉트(10/20/50건씩 보기) 출력 (값 없이 속성만 작성)
  - guide    : 우측 가이드 문구 (예: ※ ...)
  - slot     : 우측 영역 (버튼, 안내 문구 등) - 생략 가능
-->
<div class="tblTop">
  <div class="tblLeft">
    {% if title %}
    <h3 class="tblTitle">{{ title }}</h3>
    {% endif %}
    {% if count %}
    <span class="tblCount">총 <strong class="count{% if count != '0' %} point{% endif %}">{{ count }}</strong>건{% if unit %} <span class="tblUnit">({{ unit }})</span>{% endif %}</span>
    {% elif unit %}
    <span class="tblUnit">({{ unit }})</span>
    {% endif %}
    {% if text %}
    <span class="tblText">{{ text }}</span>
    {% endif %}
    {% if pageSize %}
    <select class="formControl wSm" aria-label="페이지당 건수">
      <option value="10">10건씩 보기</option>
      <option value="20">20건씩 보기</option>
      <option value="50">50건씩 보기</option>
    </select>
    {% endif %}
  </div>
  {% if guide %}
  <div class="tblRight">
    <p class="tblGuide">{{ guide }}</p>
  </div>
  {% endif %}
  {% if slot %}
  <div class="tblRight">
    {{ slot }}
  </div>
  {% endif %}
</div>
