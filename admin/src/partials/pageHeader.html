<!--
  [UI 컴포넌트] 페이지 상단 헤더
  <include src="../../partials/pageHeader.html" title="미션등록" breadcrumb="홈,미션관리,미션등록"></include>
  - title      : 페이지 타이틀 (필수)
  - breadcrumb : 브레드크럼 경로 (쉼표 구분, 마지막 항목이 현재 페이지) - 생략 가능
  - favorite   : 타이틀 옆 즐겨찾기 버튼 (값 없이 속성만 작성) - [D] 즐겨찾기 등록 시 .btnFavorite.isActive
  - slot       : 우측 영역 (작성자 정보, 버튼 등) - 생략 가능
-->
<div class="pageHeader">
  {% if favorite %}
  <div class="headerLeft">
    <h2 class="pageTitle">{{ title }}</h2>
    <!-- [M] 20261016 즐겨찾기 제거 -->
    <!-- <button type="button" class="btnFavorite" aria-label="즐겨찾기 추가/해제">

      </svg>
    </button> -->
  </div>
  {% else %}
  <h2 class="pageTitle">{{ title }}</h2>
  {% endif %}
  {% if breadcrumb %}
  <include src="./breadcrumb.html" items="{{ breadcrumb }}"></include>
  {% endif %}
  {% if slot %}
  <div class="headerRight">
    {{ slot }}
  </div>
  {% endif %}
</div>
