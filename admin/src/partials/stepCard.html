<!--
  [UI 컴포넌트] STEP 카드 (드래그 핸들 + 단계 타이틀 + 복사 / 삭제 + 입력 폼 테이블)
  <include src="../../partials/stepCard.html" step="1" title="정상 미션">
    <tr>
      <th><label class="formLabel">코스명 <span class="required">*</span></label></th>
      <td><input type="text" class="formControl full"></td>
    </tr>
  </include>
  - step    : 단계 번호
  - title   : 단계 타이틀
  - thWidth : 항목명(th) 너비 (기본: 120px)
  - slot    : 테이블 행 (<tr><th><label class="formLabel">항목명</label></th><td>입력 영역</td></tr>)
  [D] 드래그 중인 원본: .stepCard.isDragging / 미리보기: .stepCard.isOverlay (스타일: dnd.scss)
-->
<div class="stepCard">
  <div class="stepHeader">
    <div class="stepTitleWrap">
      <span class="ico lg stepHandle"></span>
      <h4 class="stepTitle">STEP {{ step }}. {{ title }}</h4>
    </div>
    <div class="stepActions">
      <button type="button" class="btn outline sm">복사</button>
      <button type="button" class="btn danger sm">삭제</button>
    </div>
  </div>
  <table class="tbl">
    <colgroup>
      <col :style="width: {{ thWidth | default('120px', true) }};">
      <col>
    </colgroup>
    <tbody>
      {{ slot }}
    </tbody>
  </table>
</div>
